# Temporary workflow of the prototype branch `proto/streaming-prune-empty-relation`: the
# prototype is compiled and tested here instead of on the development machine. To be dropped
# before the prototype is integrated into a `fork/*` branch.
#
# - `planner`: regenerates the expected outputs of the planner tests and uploads the files that
#   changed, then runs the unit tests of the frontend.
# - `clippy`: lints the frontend.
name: Proto Streaming Prune Check

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'proto/streaming-prune-empty-relation'

concurrency:
  group: proto-streaming-prune-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '3'
  # Without debug info the test binaries fit the disk and the memory of a hosted runner.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  planner:
    name: Planner and frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force || true
          sudo fallocate -l 16G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          df -h /
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            build-essential pkg-config make cmake lld protobuf-compiler libprotobuf-dev \
            curl git unzip \
            libssl-dev libsasl2-dev python3.12 python3.12-dev libblas-dev liblapack-dev libomp-dev

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- --no-modify-path --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install --profile minimal
          rustup show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-amd64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-amd64-

      - name: Install cargo-nextest
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-nextest

      # The expected outputs are regenerated instead of checked: the job uploads what changed,
      # which is then reviewed and committed.
      - name: Regenerate the planner test outputs
        id: planner
        run: |
          UPDATE_EXPECT=1 cargo nextest run --locked --no-fail-fast --retries 0 \
            -p risingwave_planner_test

      - name: Collect the planner test outputs that changed
        if: ${{ !cancelled() }}
        run: |
          out=src/frontend/planner_test/tests/testdata/output
          mkdir -p "$RUNNER_TEMP/planner"
          git status --short -- "$out" | tee "$RUNNER_TEMP/planner/status.txt"
          git diff -- "$out" > "$RUNNER_TEMP/planner/tracked.diff"
          git ls-files --modified --others --exclude-standard -- "$out" \
            | tar -czf "$RUNNER_TEMP/planner/outputs.tar.gz" -T -
          {
            echo '## Planner test outputs that changed'
            echo '```'
            cat "$RUNNER_TEMP/planner/status.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the planner test outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-outputs
          path: ${{ runner.temp }}/planner
          if-no-files-found: warn

      - name: Frontend and session configuration unit tests
        if: ${{ !cancelled() && steps.planner.outcome != 'skipped' }}
        run: |
          cargo nextest run --locked --no-fail-fast --lib \
            -p risingwave_frontend -p risingwave_common

  clippy:
    name: Clippy on the frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force || true
          sudo fallocate -l 16G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            build-essential pkg-config make cmake lld protobuf-compiler libprotobuf-dev \
            curl git unzip \
            libssl-dev libsasl2-dev python3.12 python3.12-dev libblas-dev liblapack-dev libomp-dev

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- --no-modify-path --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install --profile minimal --component clippy --component rustfmt
          rustup show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-amd64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-amd64-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p risingwave_frontend --all-targets -- -D warnings
