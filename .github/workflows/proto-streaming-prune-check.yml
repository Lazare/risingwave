# Temporary workflow of the prototype branch `proto/streaming-prune-empty-relation`: the
# prototype is compiled and tested here instead of on the development machine. To be dropped
# before the prototype is integrated into a `fork/*` branch.
#
# - `planner`: regenerates the expected outputs of the planner tests and uploads the files that
#   changed, then runs the unit tests of the frontend.
# - `clippy`: lints the frontend.
# - `e2e`: builds the node, runs the differential test of the pruning, then the whole streaming
#   SLT suite twice, without and with `streaming_prune_empty_relation`: a file that only fails
#   with the pruning is a regression.
name: Proto Streaming Prune Check

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'proto/streaming-prune-empty-relation'

concurrency:
  group: proto-streaming-prune-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '3'
  # Without debug info the test binaries fit the disk and the memory of a hosted runner.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  planner:
    name: Planner and frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force || true
          sudo fallocate -l 16G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          df -h /
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            build-essential pkg-config make cmake lld protobuf-compiler libprotobuf-dev \
            curl git unzip \
            libssl-dev libsasl2-dev python3.12 python3.12-dev libblas-dev liblapack-dev libomp-dev

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- --no-modify-path --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install --profile minimal
          rustup show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-amd64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-amd64-

      - name: Install cargo-nextest
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-nextest

      # The expected outputs are regenerated instead of checked: the job uploads what changed,
      # which is then reviewed and committed.
      - name: Regenerate the planner test outputs
        id: planner
        run: |
          UPDATE_EXPECT=1 cargo nextest run --locked --no-fail-fast --retries 0 \
            -p risingwave_planner_test

      - name: Collect the planner test outputs that changed
        if: ${{ !cancelled() }}
        run: |
          out=src/frontend/planner_test/tests/testdata/output
          mkdir -p "$RUNNER_TEMP/planner"
          git status --short -- "$out" | tee "$RUNNER_TEMP/planner/status.txt"
          git diff -- "$out" > "$RUNNER_TEMP/planner/tracked.diff"
          git ls-files --modified --others --exclude-standard -- "$out" \
            | tar -czf "$RUNNER_TEMP/planner/outputs.tar.gz" -T -
          {
            echo '## Planner test outputs that changed'
            echo '```'
            cat "$RUNNER_TEMP/planner/status.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the planner test outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-outputs
          path: ${{ runner.temp }}/planner
          if-no-files-found: warn

      - name: Frontend and session configuration unit tests
        if: ${{ !cancelled() && steps.planner.outcome != 'skipped' }}
        run: |
          cargo nextest run --locked --no-fail-fast --lib \
            -p risingwave_frontend -p risingwave_common

  clippy:
    name: Clippy on the frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force || true
          sudo fallocate -l 16G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            build-essential pkg-config make cmake lld protobuf-compiler libprotobuf-dev \
            curl git unzip \
            libssl-dev libsasl2-dev python3.12 python3.12-dev libblas-dev liblapack-dev libomp-dev

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- --no-modify-path --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install --profile minimal
          rustup component add clippy rustfmt
          rustup show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-amd64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-amd64-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p risingwave_frontend --all-targets -- -D warnings

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force || true
          sudo fallocate -l 16G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            build-essential pkg-config make cmake lld protobuf-compiler libprotobuf-dev \
            curl git unzip \
            libssl-dev libsasl2-dev python3.12 python3.12-dev libblas-dev liblapack-dev libomp-dev

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- --no-modify-path --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install --profile minimal
          rustup show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-amd64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-amd64-

      - name: Install sqllogictest
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked sqllogictest-bin@0.29.1

      - name: Build the all-in-one binary
        run: cargo build --locked -p risingwave_cmd_all

      - name: Start a single node
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          nohup ./target/debug/risingwave single_node > "$RUNNER_TEMP/e2e/node.log" 2>&1 &
          for _ in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/4566) 2>/dev/null; then echo ready; exit 0; fi
            sleep 2
          done
          tail -50 "$RUNNER_TEMP/e2e/node.log"
          exit 1

      - name: Differential test of the pruning
        id: differential
        run: |
          export PATH="$PWD/e2e_test/commands:$PATH"
          sqllogictest -p 4566 -d dev './e2e_test/streaming/prune_empty_relation.slt' \
            2>&1 | tee "$RUNNER_TEMP/e2e/differential.log"

      - name: Streaming SLT suite without pruning (reference)
        if: ${{ !cancelled() && steps.differential.outcome != 'skipped' }}
        run: |
          export PATH="$PWD/e2e_test/commands:$PATH"
          sqllogictest -p 4566 -d dev -j 8 --label parallel './e2e_test/streaming/**/*.slt' \
            > "$RUNNER_TEMP/e2e/suite-off.log" 2>&1 || true
          echo "ok=$(grep -a -c '\[OK\]' "$RUNNER_TEMP/e2e/suite-off.log") failed=$(grep -a -c '\[FAILED\]' "$RUNNER_TEMP/e2e/suite-off.log")"

      - name: Streaming SLT suite with pruning
        if: ${{ !cancelled() && steps.differential.outcome != 'skipped' }}
        run: |
          export PATH="$PWD/e2e_test/commands:$PATH"
          printf 'statement ok\nalter system set streaming_prune_empty_relation to true;\n' \
            > "$RUNNER_TEMP/e2e/enable.slt"
          sqllogictest -p 4566 -d dev "$RUNNER_TEMP/e2e/enable.slt"
          sqllogictest -p 4566 -d dev -j 8 --label parallel './e2e_test/streaming/**/*.slt' \
            > "$RUNNER_TEMP/e2e/suite-on.log" 2>&1 || true
          echo "ok=$(grep -a -c '\[OK\]' "$RUNNER_TEMP/e2e/suite-on.log") failed=$(grep -a -c '\[FAILED\]' "$RUNNER_TEMP/e2e/suite-on.log")"
          failed() {
            sed 's/\x1b\[[0-9;]*m//g' "$1" | grep -a '^failed to run' \
              | sed "s/^failed to run \`\(.*\)\`.*/\1/" | sort -u
          }
          failed "$RUNNER_TEMP/e2e/suite-off.log" > "$RUNNER_TEMP/e2e/failed-off.txt"
          failed "$RUNNER_TEMP/e2e/suite-on.log" > "$RUNNER_TEMP/e2e/failed-on.txt"
          comm -13 "$RUNNER_TEMP/e2e/failed-off.txt" "$RUNNER_TEMP/e2e/failed-on.txt" \
            > "$RUNNER_TEMP/e2e/regressions.txt"
          {
            echo '## Streaming SLT suite'
            echo "Failed without pruning: $(wc -l < "$RUNNER_TEMP/e2e/failed-off.txt"), with pruning: $(wc -l < "$RUNNER_TEMP/e2e/failed-on.txt")"
            echo '### Files that only fail with the pruning'
            echo '```'
            cat "$RUNNER_TEMP/e2e/regressions.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The suites must reach their end: a stuck node fails everything after.
          test "$(grep -a -c '\[OK\]' "$RUNNER_TEMP/e2e/suite-on.log")" -ge 300
          if [ -s "$RUNNER_TEMP/e2e/regressions.txt" ]; then
            while read -r file; do
              sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/e2e/suite-on.log" \
                | grep -a -A25 "^failed to run \`$file\`" | cut -c1-300 | head -40
            done < "$RUNNER_TEMP/e2e/regressions.txt"
            exit 1
          fi

      - name: Messages of the pruning in the node log
        if: ${{ !cancelled() }}
        run: |
          grep -a -c 'pruned the sub-plans proven empty' "$RUNNER_TEMP/e2e/node.log" || true
          grep -a 'pruned the sub-plans proven empty' "$RUNNER_TEMP/e2e/node.log" | head -60 | cut -c1-400 || true
          grep -a -i 'panicked' "$RUNNER_TEMP/e2e/node.log" | head -20 || true

      - name: Upload the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e
          if-no-files-found: warn
