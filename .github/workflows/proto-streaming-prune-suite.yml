# Temporary workflow of the prototype branch `proto/streaming-prune-empty-relation`, to be dropped
# with `proto-streaming-prune-check.yml`.
#
# Runs the whole streaming SLT suite twice in parallel, once with the defaults and once with
# `streaming_prune_empty_relation` and `streaming_simplify_on_unique_key` turned on for every
# session: a file that only fails with the variables on is a regression. Takes hours, so it only
# runs on demand: push the commit to test to a branch named `proto-suite/<anything>`.
name: Proto Streaming Prune Suite

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'proto-suite/**'

concurrency:
  group: proto-streaming-prune-suite-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '3'
  # Without debug info the binary fits the disk and the memory of a hosted runner.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  e2e:
    name: Streaming SLT suite, pruning ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        mode: ['off', 'on']
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force || true
          sudo fallocate -l 16G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            build-essential pkg-config make cmake lld protobuf-compiler libprotobuf-dev \
            curl git unzip \
            libssl-dev libsasl2-dev python3.12 python3.12-dev libblas-dev liblapack-dev libomp-dev

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- --no-modify-path --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install --profile minimal
          rustup show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-amd64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-amd64-

      - name: Install sqllogictest
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked sqllogictest-bin@0.29.1

      - name: Build the all-in-one binary
        run: cargo build --locked -p risingwave_cmd_all

      - name: Start a single node
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          nohup ./target/debug/risingwave single_node > "$RUNNER_TEMP/e2e/node.log" 2>&1 &
          for _ in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/4566) 2>/dev/null; then echo ready; exit 0; fi
            sleep 2
          done
          tail -50 "$RUNNER_TEMP/e2e/node.log"
          exit 1

      - name: Turn the pruning on for every session
        if: ${{ matrix.mode == 'on' }}
        run: |
          printf 'statement ok\nalter system set %s to true;\n\n' \
            streaming_prune_empty_relation streaming_simplify_on_unique_key \
            > "$RUNNER_TEMP/e2e/enable.slt"
          cat "$RUNNER_TEMP/e2e/enable.slt"
          sqllogictest -p 4566 -d dev "$RUNNER_TEMP/e2e/enable.slt"

      # The progress is printed so that a stuck file is visible in the log of the job. The
      # result is decided by the `compare` job.
      - name: Streaming SLT suite
        run: |
          export PATH="$PWD/e2e_test/commands:$PATH"
          log="$RUNNER_TEMP/e2e/suite.log"
          set +e
          timeout --signal=INT --kill-after=60 150m \
            sqllogictest -p 4566 -d dev './e2e_test/streaming/**/*.slt' > "$log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            sleep 120
            echo "$(date -u +%H:%M:%S) ok=$(grep -a -c '\[OK\]' "$log") failed=$(grep -a -c '\[FAILED\]' "$log") last: $(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -a -v '^$' | tail -1 | cut -c1-150)"
          done
          wait "$pid"
          echo "exit=$?" | tee "$RUNNER_TEMP/e2e/suite-exit.txt"
          set -e
          sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -a '^failed to run' \
            | sed "s/^failed to run \`\(.*\)\`.*/\1/" | sort -u > "$RUNNER_TEMP/e2e/failed.txt"
          echo "ok=$(grep -a -c '\[OK\]' "$log") failed=$(wc -l < "$RUNNER_TEMP/e2e/failed.txt")" \
            | tee "$RUNNER_TEMP/e2e/suite-count.txt"
          cat "$RUNNER_TEMP/e2e/failed.txt"

      - name: Messages of the pruning in the node log
        if: ${{ !cancelled() }}
        run: |
          grep -a -c 'pruned the sub-plans proven empty' "$RUNNER_TEMP/e2e/node.log" || true
          grep -a 'pruned the sub-plans proven empty' "$RUNNER_TEMP/e2e/node.log" | head -80 | cut -c1-420 || true
          grep -a -i 'panicked' "$RUNNER_TEMP/e2e/node.log" | head -20 || true

      - name: Upload the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.mode }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: warn

  compare:
    name: Streaming SLT suite, with and without pruning
    runs-on: ubuntu-24.04
    needs: e2e
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Files that only fail with the pruning
        run: |
          for mode in off on; do
            echo "== $mode: $(cat "artifacts/e2e-$mode/suite-count.txt") $(cat "artifacts/e2e-$mode/suite-exit.txt")"
          done
          comm -13 artifacts/e2e-off/failed.txt artifacts/e2e-on/failed.txt > regressions.txt
          {
            echo '## Streaming SLT suite'
            echo "Without pruning: $(cat artifacts/e2e-off/suite-count.txt), with pruning: $(cat artifacts/e2e-on/suite-count.txt)"
            echo '### Files that only fail with the pruning'
            echo '```'
            cat regressions.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Both suites must reach their end, and as many files must pass with the pruning.
          grep -qx 'exit=0\|exit=1' artifacts/e2e-on/suite-exit.txt
          ok_off=$(grep -a -c '\[OK\]' artifacts/e2e-off/suite.log)
          ok_on=$(grep -a -c '\[OK\]' artifacts/e2e-on/suite.log)
          test "$ok_on" -ge "$ok_off"
          if [ -s regressions.txt ]; then
            while read -r file; do
              sed 's/\x1b\[[0-9;]*m//g' artifacts/e2e-on/suite.log \
                | grep -a -A25 "^failed to run \`$file\`" | cut -c1-300 | head -40
            done < regressions.txt
            exit 1
          fi
