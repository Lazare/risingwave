# Tests for `batch_inline_values_join` (`ValuesJoinInlineRule`): a join with a small relation of
# constant rows becomes a filter (`IN` list) and a projection (`CASE`) of the other side.
- id: setup_off
  sql: |
    create table t (k int primary key, code varchar, x int);
  expected_outputs: []
- id: setup
  sql: |
    set batch_inline_values_join = true;
    create table t (k int primary key, code varchar, x int);
    create table td (k int primary key, d decimal);
  expected_outputs: []

# The variable is off by default: the constant rows stay a join input.
- name: off by default - inner join with constant rows is kept
  before: [setup_off]
  sql: |
    with m(code, label) as (values ('a', 'Alpha'), ('b', 'Beta'))
    select t.k, m.label from t join m on t.code = m.code;
  expected_outputs:
  - batch_plan

# Rewritten.

- name: inner join on the primary key - scan ranges
  before: [setup]
  sql: |
    select t.code, v.label from t join (values (1, 'one'), (3, 'three')) v(k, label) on t.k = v.k;
  expected_outputs:
  - batch_plan
- name: inner join - labels as case
  before: [setup]
  sql: |
    with m(code, label) as (values ('a', 'Alpha'), ('b', 'Beta'))
    select t.k, m.code, m.label from t join m on t.code = m.code;
  expected_outputs:
  - batch_plan
- name: left join - case without else
  before: [setup]
  sql: |
    with m(code, label) as (values ('a', 'Alpha'), ('b', 'Beta'))
    select t.k, m.label from t left join m on t.code = m.code;
  expected_outputs:
  - batch_plan
- name: semi join - in list on the primary key
  before: [setup]
  sql: |
    select * from t where t.k in (select c from (values (1), (2), (2), (null)) v(c));
  expected_outputs:
  - batch_plan
- name: anti join - not exists
  before: [setup]
  sql: |
    select * from t where not exists (select 1 from (values ('a'), ('b')) v(c) where v.c = t.code);
  expected_outputs:
  - batch_plan
- name: semi join - range condition, one disjunct per row
  before: [setup]
  sql: |
    select * from t where exists (select 1 from (values (1, 10), (20, 30)) v(lo, hi) where t.x between v.lo and v.hi);
  expected_outputs:
  - batch_plan
- name: inner join - 64 rows, the largest relation inlined
  before: [setup]
  sql: |
    select t.code, v.label from t join (values (0, 'v0'), (1, 'v1'), (2, 'v2'), (3, 'v3'), (4, 'v4'), (5, 'v5'), (6, 'v6'), (7, 'v7'), (8, 'v8'), (9, 'v9'), (10, 'v10'), (11, 'v11'), (12, 'v12'), (13, 'v13'), (14, 'v14'), (15, 'v15'), (16, 'v16'), (17, 'v17'), (18, 'v18'), (19, 'v19'), (20, 'v20'), (21, 'v21'), (22, 'v22'), (23, 'v23'), (24, 'v24'), (25, 'v25'), (26, 'v26'), (27, 'v27'), (28, 'v28'), (29, 'v29'), (30, 'v30'), (31, 'v31'), (32, 'v32'), (33, 'v33'), (34, 'v34'), (35, 'v35'), (36, 'v36'), (37, 'v37'), (38, 'v38'), (39, 'v39'), (40, 'v40'), (41, 'v41'), (42, 'v42'), (43, 'v43'), (44, 'v44'), (45, 'v45'), (46, 'v46'), (47, 'v47'), (48, 'v48'), (49, 'v49'), (50, 'v50'), (51, 'v51'), (52, 'v52'), (53, 'v53'), (54, 'v54'), (55, 'v55'), (56, 'v56'), (57, 'v57'), (58, 'v58'), (59, 'v59'), (60, 'v60'), (61, 'v61'), (62, 'v62'), (63, 'v63')) v(k, label) on t.x = v.k;
