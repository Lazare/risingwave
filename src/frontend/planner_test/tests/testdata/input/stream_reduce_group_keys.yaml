# Tests for `streaming_reduce_group_keys` and `batch_reduce_group_keys`
# (`AggGroupKeyReduceRule`): the group key columns that the other ones determine are removed,
# and `min`, `max`, `first_value`, `last_value` of a value of the group are replaced.
- id: setup_off
  sql: |
    create table o (id int primary key, placed date, cust int);
    create table i (iid int primary key, o_id int, qty int);
    create table t (k int primary key, a int, b int, c int);
    create table w (k int, v int, ts timestamp, watermark for ts as ts - interval '1' second) append only;
  expected_outputs: []
- id: setup
  sql: |
    set streaming_reduce_group_keys = true;
    set batch_reduce_group_keys = true;
    create table o (id int primary key, placed date, cust int);
    create table i (iid int primary key, o_id int, qty int);
    create table t (k int primary key, a int, b int, c int);
    create table w (k int, v int, ts timestamp, watermark for ts as ts - interval '1' second) append only;
  expected_outputs: []

# The variables are off by default.
- name: off by default - a key that the key of a join side determines
  before: [setup_off]
  sql: |
    select o.id, o.placed, sum(i.qty) from o join i on i.o_id = o.id group by o.id, o.placed;
  expected_outputs:
  - batch_plan
  - stream_plan

# Rewritten.
- name: a key that the key of a join side determines
  before: [setup]
  sql: |
    select o.id, o.placed, sum(i.qty) from o join i on i.o_id = o.id group by o.id, o.placed;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: a key equal to another one
  before: [setup]
  sql: |
    select o.id, i.o_id, sum(i.qty) from o join i on i.o_id = o.id group by o.id, i.o_id;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: a constant key
  before: [setup]
  sql: |
    select a, b, count(*) from t where b = 3 group by a, b;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: only constant keys - one is kept
  before: [setup]
  sql: |
    select a, b, count(*) from t where a = 1 and b = 3 group by a, b;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: a literal key
  before: [setup]
  sql: |
    select a, 'x' as tag, count(*) from t group by a, tag;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: max and min of a group key
  before: [setup]
  sql: |
    select a, max(a) as mx, min(a) as mn, count(*) from t group by a;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: max of a value that the group key determines
  before: [setup]
  sql: |
    select o.id, max(o.placed) as p, sum(i.qty) from o join i on i.o_id = o.id group by o.id;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: first_value of a group key
  before: [setup]
  sql: |
    select a, first_value(a order by b) as f, sum(c) from t group by a;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: a key determined by the key of a sub-aggregation
  before: [setup]
  sql: |
    select a, mb, count(*) from (select a, max(b) as mb from t group by a) x group by a, mb;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: batch only - a table with a watermark
  before: [setup]
  sql: |
    select k, v, count(*) from w where v = 1 group by k, v;
  expected_outputs:
  - batch_plan
  - stream_plan

# Left as they are.
- name: a key of the padded side of a left join
  before: [setup]
  sql: |
    select i.iid, o.placed, count(*) from i left join o on i.o_id = o.id group by i.iid, o.placed;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: max with a filter
  before: [setup]
  sql: |
    select a, max(a) filter (where b > 0) as mx from t group by a;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: max of a column that the group key does not determine
  before: [setup]
  sql: |
    select a, max(b) as mb from t group by a;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: keys that determine nothing
  before: [setup]
  sql: |
    select a, b, count(*) from t group by a, b;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: no group key - max of a constant is kept (a row with no input)
  before: [setup]
  sql: |
    select max(b) as mb, count(*) from t where b = 3;
  expected_outputs:
  - batch_plan
  - stream_plan

# A key column that the input is distributed by is kept when removing it would cost an exchange
# of the input: the join below is distributed by both columns of its key.
- id: setup_dist
  sql: |
    set streaming_reduce_group_keys = true;
    set batch_reduce_group_keys = true;
    create table p (x int, k int primary key, v int);
    create table q (x int, k int, w int);
    create table s (xs int[], ys int[], k int primary key);
  expected_outputs: []
- name: a key of the join distribution is kept
  before: [setup_dist]
  sql: |
    select p.x, p.k, sum(q.w) from p join q on p.x = q.x and p.k = q.k group by p.x, p.k;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: a key outside the join distribution is still removed
  before: [setup_dist]
  sql: |
    select p.x, p.k, p.v, sum(q.w) from p join q on p.x = q.x and p.k = q.k group by p.x, p.k, p.v;
  expected_outputs:
  - batch_plan
  - stream_plan
- name: correlated sum over an unnested array - the join key is kept
  before: [setup_dist]
  sql: |
    select *, (select sum(i) from (select unnest(xs) i, 1 c) Q where k = c) as sum_x from s;
  expected_outputs:
  - batch_plan
- name: a key determined by the distribution key of the table scanned is removed
  before: [setup_dist]
  sql: |
    select k, x, count(*) from p group by k, x;
  expected_outputs:
  - batch_plan
  - stream_plan
# The computations over the aggregations stay below the join of the two sides (no stacked sort
# on the reduced key above the join).
- id: setup_sort
  sql: |
    set batch_reduce_group_keys = true;
    create table f (d_id int, i_id int, w_id int, qty int);
    create table item (i_id int primary key);
    create table wh (w_id int primary key, w_name varchar);
    create table dd (d_id int primary key, moy int, yr int);
  expected_outputs: []
- name: self join of reduced aggregations with an order by
  before: [setup_sort]
  sql: |
    with g as (
      select w_name, wh.w_id, item.i_id, moy, stddev_samp(qty) sd, avg(qty) m
      from f, item, wh, dd
      where f.i_id = item.i_id and f.w_id = wh.w_id and f.d_id = dd.d_id and yr = 2001
      group by w_name, wh.w_id, item.i_id, moy),
    v as (select w_id, i_id, moy, m, case m when 0 then null else sd / m end cov from g
      where case m when 0 then 0 else sd / m end > 1)
    select v1.w_id, v1.i_id, v1.moy, v1.m, v1.cov, v2.moy, v2.m, v2.cov
    from v v1, v v2 where v1.i_id = v2.i_id and v1.w_id = v2.w_id and v1.moy = 1 and v2.moy = 2
    order by v1.w_id, v1.i_id, v1.moy, v1.m, v1.cov, v2.moy, v2.m, v2.cov;
  expected_outputs:
  - batch_plan
