- name: count(*) without group key over row_number() without partition = 1 is kept (a row over no rows)
  before:
  - setup
  sql: |
    select count(*) as n, max(pw) as mpw from (select k, v, row_number() over (order by v) as rn,
    lag(w) over (order by v) as pw from t) s
    where rn = 1;
  expected_outputs:
  - stream_plan
