# Inner join to semi join on a unique side that is not read, and `DISTINCT` removed under a semi or
# anti join (`batch_inner_join_to_semi_join`, rules `InnerJoinToSemiJoinRule` and
# `SemiJoinDistinctRemoveRule`). `table_row_counts` and `cardinality_observations` are test only
# (see `batch_cardinality_feedback_learning.yaml`).
- id: tables
  sql: |
    create table ijs_t (id int primary key, k int, v int);
    create table ijs_u (id int primary key, k int, w int);
    create table ijs_d (id int primary key, name varchar);
  expected_outputs: []
- name: variable off by default (inner join with the distinct side)
  before:
  - tables
  sql: |
    select t.* from ijs_t t join (select distinct k from ijs_u) x on t.k = x.k;
  expected_outputs:
  - batch_plan
- name: distinct side not read becomes a semi join (the aggregation stays without estimates)
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.* from ijs_t t join (select distinct k from ijs_u) x on t.k = x.k;
  expected_outputs:
  - batch_plan
- name: distinct side written first becomes a semi join of the other side
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.id, t.v from (select distinct k from ijs_u) x join ijs_t t on t.k = x.k;
  expected_outputs:
  - batch_plan
- name: table joined on its key, not read, becomes a semi join
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.* from ijs_t t join ijs_d d on t.k = d.id;
  expected_outputs:
  - batch_plan
- name: count over the join (no column read) becomes a semi join
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select count(*) from ijs_t t join (select distinct k from ijs_u) x on t.k = x.k;
  expected_outputs:
  - batch_plan
- name: null-safe equality on the distinct side becomes a semi join
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.* from ijs_t t join (select distinct k from ijs_u) x on t.k is not distinct from x.k;
  expected_outputs:
  - batch_plan
- name: kept, a column of the distinct side is read
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.*, x.k from ijs_t t join (select distinct k from ijs_u) x on t.k + 1 = x.k;
  expected_outputs:
  - batch_plan
- name: kept, the distinct side is not unique on the compared column (duplicates multiply rows)
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.* from ijs_t t join (select distinct k, w from ijs_u) x on t.k = x.k;
  expected_outputs:
  - batch_plan
- name: kept, table joined on a column that is not its key
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.* from ijs_t t join ijs_u u on t.k = u.k;
  expected_outputs:
  - batch_plan
- name: kept, no equality between the sides
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.* from ijs_t t join (select max(k) as m from ijs_u) x on t.k > x.m;
  expected_outputs:
  - batch_plan
- name: kept, left outer join
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.* from ijs_t t left join (select distinct k from ijs_u) x on t.k = x.k;
  expected_outputs:
  - batch_plan
- name: extra conjunct on the distinct side, still at most one match
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.* from ijs_t t join (select distinct k from ijs_u) x on t.k = x.k and x.k > t.v;
  expected_outputs:
  - batch_plan
# Removal of the aggregation under a semi join: only when the estimates say it keeps at least half
# of its rows.
- name: semi join over a distinct key of the table, with statistics (the aggregation is removed)
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select * from ijs_t t where t.k in (select distinct id from ijs_u);
  table_row_counts:
    ijs_t: 1000
    ijs_u: 100000
  expected_outputs:
  - batch_plan
- name: semi join over a distinct non-key column, with statistics and nothing learned (kept)
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select * from ijs_t t where t.k in (select distinct k from ijs_u);
  table_row_counts:
    ijs_t: 1000
    ijs_u: 100000
  expected_outputs:
  - batch_plan
- name: semi join over a distinct non-key column, learned with one group per row (removed)
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    set batch_cardinality_feedback_learning = true;
    select * from ijs_t t where t.k in (select distinct k from ijs_u);
  table_row_counts:
    ijs_t: 1000
    ijs_u: 100000
  cardinality_observations:
  - sql: select distinct k from ijs_u
    rows:
      seq_scan: [100000]
      hash_agg: [90000]
  expected_outputs:
  - batch_plan
- name: semi join over a distinct non-key column, learned with few groups (kept)
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    set batch_cardinality_feedback_learning = true;
    select * from ijs_t t where t.k in (select distinct k from ijs_u);
  table_row_counts:
    ijs_t: 1000
    ijs_u: 100000
  cardinality_observations:
  - sql: select distinct k from ijs_u
    rows:
      seq_scan: [100000]
      hash_agg: [100]
  expected_outputs:
  - batch_plan
- name: anti join over a distinct key of the table, with statistics (the aggregation is removed)
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select * from ijs_t t where not exists (select 1 from (select distinct id from ijs_u) x where x.id = t.k);
  table_row_counts:
    ijs_t: 1000
    ijs_u: 100000
  expected_outputs:
  - batch_plan
- name: inner join with a distinct key, with statistics (semi join, then the aggregation is removed)
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select t.v from ijs_t t join (select distinct id from ijs_u) x on t.k = x.id;
  table_row_counts:
    ijs_t: 1000
    ijs_u: 100000
  expected_outputs:
  - batch_plan
- name: kept, aggregation with an empty group key
  before:
  - tables
  sql: |
    set batch_inner_join_to_semi_join = true;
    select * from ijs_t t where exists (select 1 from (select count(*) as c from ijs_u) x where x.c = t.k);
  table_row_counts:
    ijs_t: 1000
    ijs_u: 100000
  expected_outputs:
  - batch_plan
