- name: test functional dependency for order key pruning (order by - prefix fd)
  sql: |
    create table t1 (id int primary key, i int);
    select id, i from t1 order by id, i limit 2;
  expected_outputs:
    - logical_plan
    - stream_plan
    - batch_plan

# Order key should not be pruned for suffix functional dependency.
- name: test functional dependency for order key pruning (order by - suffix fd)
  sql: |
    create table t1 (id int primary key, i int);
    select id, i from t1 order by i, id limit 2;
  expected_outputs:
    - logical_plan
    - stream_plan
    - batch_plan
# Order key should not be pruned for suffix functional dependency.
- name: test functional dependency for order key pruning on singleton
  sql: |
    create table t1 (id int primary key, i int);
    create materialized view v as select count(*) cnt from t1;
    select cnt from v order by cnt;
  expected_outputs:
    - logical_plan
    - stream_plan
    - batch_plan
# Order key should not be pruned for index,
# since it uses it as distribution key as well.
- name: test functional dependency for order key pruning (index)
  sql: |
    create table t1 (v1 int, v2 int);
    create materialized view v as select count(*) cnt from t1;
    explain (verbose) create index mv_idx on v(cnt);
  expected_outputs:
    - explain_output
- name: test functional dependency for order key pruning (index 2)
  sql: |
    create table t1 (v1 int primary key, v2 int);
    explain (verbose) create index mv_idx on t1(v1, v2);
  expected_outputs:
    - explain_output
- name: test functional dependency for order key pruning (index 3)
  sql: |
    create table t1 (v1 int primary key, v2 int);
    explain (verbose) create index mv_idx on t1(v2, v1);
  expected_outputs:
    - explain_output
# The input of these aggregations has at most one row, so its key is empty. The group key must
# not become empty: an aggregation without group key returns a row on an empty input.
- name: group by over an input with at most one row keeps a group key
  sql: |
    create table t1 (v1 int, v2 int);
    select cnt from (select count(*) cnt from t1) t where cnt > 5 group by cnt;
  expected_outputs:
    - batch_plan
    - stream_plan
- name: group by two columns over an input with at most one row keeps one group key
  sql: |
    create table t1 (v1 int, v2 int);
    select cnt, s from (select count(*) cnt, sum(v1) s from t1) t where cnt > 5 group by cnt, s;
  expected_outputs:
    - batch_plan
- name: except over an input with at most one row keeps a group key
  sql: |
    create table t1 (v1 int, v2 int);
    select count(*), sum(v1) from t1 except select 1::bigint, 1::bigint;
  expected_outputs:
    - batch_plan
