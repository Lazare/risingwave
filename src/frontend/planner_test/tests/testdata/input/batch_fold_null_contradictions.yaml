# Tests for `batch_fold_null_contradictions` (`NullContradictionRule`): a filter, a scan or a join
# whose condition holds both `e IS NULL` and a conjunct that can not be true when `e` is `NULL`
# produces nothing, for any deterministic expression `e`.
- id: setup_off
  sql: |
    create table t (id int primary key, a varchar, b varchar, c int, d int, j jsonb);
    create table r (id int primary key, k varchar, v int);
    create table s (id varchar primary key, x int);
  expected_outputs: []
- id: setup
  sql: |
    set batch_fold_null_contradictions = true;
    create table t (id int primary key, a varchar, b varchar, c int, d int, j jsonb);
    create table r (id int primary key, k varchar, v int);
    create table s (id varchar primary key, x int);
    create view w as select coalesce(a, b) as k, c, d from t;
  expected_outputs: []

# The variable is off by default: nothing changes.
- name: off by default - coalesce is null and a regular expression match on it
  before: [setup_off]
  sql: |
    select id from t where coalesce(a, b) is null and coalesce(a, b) ~ '^[a-z]+$';
  expected_outputs:
  - batch_plan

# Rewritten.

- name: coalesce is null and a regular expression match on it
  before: [setup]
  sql: |
    select id from t where coalesce(a, b) is null and coalesce(a, b) ~ '^[a-z]+$';
  expected_outputs:
  - batch_plan
- name: scan range on a null key and a regular expression match on the key
  before: [setup]
  sql: |
    select x from s where id is null and id ~ '^[a-z]+$';
  expected_outputs:
  - batch_plan
- name: through a view - the projected coalesce is null and like
  before: [setup]
  sql: |
    select k, c from w where k is null and k like 'x%';
  expected_outputs:
  - batch_plan
- name: an argument of the coalesce compared with a constant
  before: [setup]
  sql: |
    select id from t where coalesce(a, b) is null and b = 'x';
  expected_outputs:
  - batch_plan
- name: a cast is null and arithmetic on it
  before: [setup]
  sql: |
    select id from t where a::int is null and a::int + 1 > 3;
  expected_outputs:
  - batch_plan
- name: or of strict conjuncts
  before: [setup]
  sql: |
    select id from t where c is null and (c > 10 or upper(a || c::varchar) = 'X');
  expected_outputs:
  - batch_plan
- name: json access is null and compared
  before: [setup]
  sql: |
    select id from t where j->>'k' is null and j->>'k' = 'x';
  expected_outputs:
  - batch_plan
- name: is not null and in on a greatest of columns
  before: [setup]
  sql: |
    select id from t where greatest(c, d) is null and (c is not null or d in (1, 2));
  expected_outputs:
  - batch_plan
- name: the whole join is removed below a count
  before: [setup]
  sql: |
    select count(*) from t join r on t.a = r.k
    where coalesce(t.a, t.b) is null and upper(coalesce(t.a, t.b)) = 'X';
  expected_outputs:
  - batch_plan
- name: a branch of a union all is removed
  before: [setup]
  sql: |
    select id, c from t where c > 0
    union all
    select id, c from t where coalesce(c, d) is null and coalesce(c, d) <> 0;
  expected_outputs:
  - batch_plan
- name: the preserved side of a right join is empty, the join is removed
  before: [setup]
  sql: |
    select r.k, q.c from r right join (select c, coalesce(a, b) as key from t) q on r.k = q.key
    where q.key is null and q.key ~ '^[0-9]+$';
  expected_outputs:
  - batch_plan
- name: another coalesce of the same columns - all its arguments are null
  before: [setup]
  sql: |
    select id from t where coalesce(a, b) is null and coalesce(b, a) ~ '^x';
  expected_outputs:
  - batch_plan
- name: left join condition never true - the right side is removed
  before: [setup]
  sql: |
    select t.id, r.k from t left join r on coalesce(t.a, t.b) is null and coalesce(t.a, t.b) = r.k;
  expected_outputs:
  - batch_plan

# Kept.

- name: kept - coalesce with a constant is not strict
  before: [setup]
  sql: |
    select id from t where a is null and coalesce(a, 'z') = 'z';
  expected_outputs:
  - batch_plan
- name: kept - greatest skips its null arguments
  before: [setup]
  sql: |
    select id from t where c is null and greatest(c, 1) > 0;
  expected_outputs:
  - batch_plan
- name: kept - concat skips its null arguments
  before: [setup]
  sql: |
    select id from t where a is null and concat(a, 'x') = 'x';
  expected_outputs:
  - batch_plan
- name: kept - case is not strict
  before: [setup]
  sql: |
    select id from t where c is null and case when c is null then 1 else c end = 1;
  expected_outputs:
  - batch_plan
- name: kept - is distinct from is true on null
  before: [setup]
  sql: |
    select id from t where c is null and c is distinct from 1;
  expected_outputs:
  - batch_plan
- name: kept - not of is not null is the same test
  before: [setup]
  sql: |
    select id from t where coalesce(a, b) is null and not (coalesce(a, b) is not null);
  expected_outputs:
  - batch_plan
- name: kept - the contradiction is inside an or
  before: [setup]
  sql: |
    select id from t where (coalesce(a, b) is null and coalesce(a, b) ~ '^x') or d = 1;
  expected_outputs:
  - batch_plan
- name: kept - is null or a strict conjunct
  before: [setup]
  sql: |
    select id from t where a is null or a ~ '^x';
  expected_outputs:
  - batch_plan
- name: kept - another expression of a column that may not be null
  before: [setup]
  sql: |
    select id from t where coalesce(a, b) is null and coalesce(a, c::varchar) ~ '^x';
  expected_outputs:
  - batch_plan
- name: kept - a volatile expression is evaluated twice
  before: [setup]
  sql: |
    select id from t where (c + (random() * 2)::int) is null and (c + (random() * 2)::int) > 1;
  expected_outputs:
  - batch_plan
- name: kept - the padded side of a left join is null and a non-strict conjunct
  before: [setup]
  sql: |
    select t.id from t left join r on t.id = r.id where r.k is null and coalesce(r.k, t.a) = 'x';
  expected_outputs:
  - batch_plan
- name: kept - the padded side of a left join is null
  before: [setup]
  sql: |
    select t.id from t left join r on t.id = r.id where r.v is null and t.c > 1;
  expected_outputs:
  - batch_plan
