# Tests for `batch_push_agg_below_join` (`AggJoinTransposeRule`, exact form) and
# `batch_partial_agg_below_join` (partial form, chosen with the group ratios learned by
# `batch_cardinality_feedback_learning`; `cardinality_observations` records a query as if it had
# run, see `batch_cardinality_feedback_learning.yaml`).
- id: setup_off
  sql: |
    create table f (id int primary key, k int, k2 int, x int, y bigint, r real);
    create table d (id int primary key, name varchar, region int);
    create table e (k int, w int);
  expected_outputs: []
- id: setup
  sql: |
    set batch_push_agg_below_join = true;
    create table f (id int primary key, k int, k2 int, x int, y bigint, r real);
    create table d (id int primary key, name varchar, region int);
    create table d2 (id int, ver int, w int, primary key (id, ver));
    create table e (k int, w int);
  expected_outputs: []
- id: setup_partial
  sql: |
    set batch_partial_agg_below_join = true;
    set batch_cardinality_feedback_learning = true;
    create table f (id int primary key, k int, k2 int, x int, y bigint, r real);
    create table d (id int primary key, name varchar, region int);
    create table e (k int, w int);
  expected_outputs: []

# The variables are off by default: nothing changes.
- name: off by default - left join to a unique side is kept
  before: [setup_off]
  sql: |
    select f.k, d.name, sum(f.x) as s, count(*) as n from f left join d on f.k = d.id group by f.k, d.name;
  expected_outputs:
  - batch_plan
- name: off by default - join to a side that is not unique, with a learned group ratio
  before: [setup_off]
  sql: |
    set batch_cardinality_feedback_learning = true;
    select f.k, sum(f.x) as s, count(*) as n from f join e on f.k = e.k group by f.k;
  cardinality_observations:
  - sql: select k, count(*) from f group by k
    rows:
      seq_scan: [100000]
      hash_agg: [100]
  expected_outputs:
  - batch_plan

# Exact form: rewritten.

- name: exact - left join to a unique side
  before: [setup]
  sql: |
    select f.k, d.name, sum(f.x) as s, count(*) as n from f left join d on f.k = d.id group by f.k, d.name;
  expected_outputs:
  - logical_plan
  - optimized_logical_plan_for_batch
  - batch_plan
- name: exact - inner join to a whole table, grouped by the key of that table
  before: [setup]
  sql: |
    select d.id, d.name, max(f.x) as m, count(distinct f.y) as c from f join d on f.k = d.id group by d.id, d.name;
  expected_outputs:
  - batch_plan
- name: exact - two unique sides
  before: [setup]
  sql: |
    select f.k, f.k2, d.name, d2.w, sum(f.x) as s from f left join d on f.k = d.id
    left join d2 on f.k2 = d2.id and d2.ver = 1 group by f.k, f.k2, d.name, d2.w;
  expected_outputs:
  - batch_plan
- name: exact - min of a column of the unique side, filter clause
  before: [setup]
  sql: |
    select f.k, min(d.name) as mn, count(*) filter (where f.x > 0) as p from f left join d on f.k = d.id group by f.k;
  expected_outputs:
  - batch_plan

# Exact form: left as they are.

- name: exact - inner join to a filtered unique side (may drop most rows)
  before: [setup]
  sql: |
    select f.k, sum(f.x) as s from f join d on f.k = d.id where d.region = 3 group by f.k;
  expected_outputs:
  - batch_plan
- name: exact - the other side is not unique
  before: [setup]
  sql: |
    select f.k, sum(f.x) as s from f left join e on f.k = e.k group by f.k;
  expected_outputs:
  - batch_plan
- name: exact - a volatile expression in an aggregate
  before: [setup]
  sql: |
    select f.k, sum(f.x * random()) as s from f left join d on f.k = d.id group by f.k;
  expected_outputs:
  - batch_plan
- name: exact - no group key
  before: [setup]
  sql: |
    select count(*) as n from f left join d on f.k = d.id;
  expected_outputs:
  - batch_plan
- name: exact - grouped by a column of the optional side only
  before: [setup]
  sql: |
    select d.name, count(*) as n from f left join d on f.k = d.id group by d.name;
  expected_outputs:
  - batch_plan

# Partial form: rewritten.

- name: partial - inner join, the aggregated side was observed with 1000 rows per group
  before: [setup_partial]
  sql: |
    select f.k, sum(f.x) as s, count(*) as n, min(f.y) as m from f join e on f.k = e.k group by f.k;
  cardinality_observations:
  - sql: select k, count(*) from f group by k
    rows:
      seq_scan: [100000]
      hash_agg: [100]
  expected_outputs:
  - optimized_logical_plan_for_batch
  - batch_plan
- name: partial - left join, grouped by a column of the other side too, min of a column of the other side
  before: [setup_partial]
  sql: |
    select f.k, e.w, sum(f.y) as s, count(f.x) as n, max(e.w) as mw from f left join e on f.k = e.k group by f.k, e.w;
  cardinality_observations:
  - sql: select k, count(*) from f group by k
    rows:
      seq_scan: [100000]
      hash_agg: [30000]
  expected_outputs:
  - batch_plan
- name: partial - no group key above, bool and bit aggregates
  before: [setup_partial]
  sql: |
    select count(*) as n, bool_and(f.x > 0) as a, bit_or(f.x) as b from f join e on f.k = e.k;
  cardinality_observations:
  - sql: select k, count(*) from f group by k
    rows:
      seq_scan: [100000]
      hash_agg: [100]
  expected_outputs:
  - batch_plan

# Partial form: left as they are.

