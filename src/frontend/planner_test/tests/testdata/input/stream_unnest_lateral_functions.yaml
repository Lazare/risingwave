# A table joined back on its key with an aggregation of rows derived from itself.

- name: off by default - table joined back on its key with an aggregate over a function of itself
  before: [setup_off]
  sql: |
    select t.id, a.m from t left join (select t2.id, max(x) as m from t t2, jsonb_array_elements_text(t2.j) as x group by t2.id) a on t.id = a.id where t.c = 'c';
  expected_outputs:
  - stream_plan

- name: self aggregate - max over a function of the row, with a filter on the outer side
  before: [setup]
  sql: |
    select t.id, a.m from t left join (select t2.id, max(x) as m from t t2, jsonb_array_elements_text(t2.j) as x group by t2.id) a on t.id = a.id where t.c = 'c';
  expected_outputs:
  - stream_plan

- name: self aggregate - sum with a default
  before: [setup]
  sql: |
    select t.id, coalesce(s.total, 0) as total from t left join (select t.id, sum((e ->> 'x')::bigint) as total from t cross join jsonb_array_elements(t.j) as e group by t.id) s on t.id = s.id;
  expected_outputs:
  - stream_plan

- name: self aggregate - inner join with a child table inside, and a test of the match
  before: [setup]
  sql: |
    select t.id, t.n, s.sx, s.id is not null as matched from t left join (select t.id, sum(r.x) as sx from t join r on t.id = r.tid group by t.id) s on t.id = s.id;
  expected_outputs:
  - stream_plan

- name: self aggregate - lookup of another table by a left join inside
  before: [setup]
  sql: |
    select t.id, t.n, coalesce(p.s, 0) as s from t left join (select t.id, sum(b.v) as s from t cross join jsonb_array_elements_text(t.j) as e(x) left join b on e.x = b.k group by t.id) p on t.id = p.id;
  expected_outputs:
  - stream_plan

- name: self aggregate - inner join, with a condition on the rows of the function
  before: [setup]
  sql: |
    select t.id, s.cnt from t join (select t.id, count(*) as cnt from t, unnest(t.arr) as v where v > 1 group by t.id) s on t.id = s.id;
  expected_outputs:
  - stream_plan

- name: self aggregate - a column of the row in the group key
  before: [setup]
  sql: |
    select t.id, a.n, a.m from t left join (select t2.id, t2.n, max(v) as m from t t2, unnest(t2.arr) as v group by t2.id, t2.n) a on t.id = a.id;
  expected_outputs:
  - stream_plan

- name: self aggregate - the outer side is a view of the table carrying its key
  before: [setup]
  sql: |
    select tv.id, tv.n, a.c from tv left join (select id, count(*) as c from t, unnest(arr) as v group by id) a on tv.id = a.id;
  expected_outputs:
  - stream_plan

- name: self aggregate - the left side carries the row of the table through a lookup join
  before: [setup]
  sql: |
    select e.id, e.n, l.ref, a.p, a.q
    from (select id, n, j from t where c = 'k') e
    left join rr l on e.id = l.eid
    left join (
      select t2.id, max(case when m[1] = 'P' then m[2] end) as p, max(case when m[1] = 'Q' then m[2] end) as q
      from t t2, jsonb_array_elements_text(t2.j -> 'a' -> 'b') as w(v), regexp_matches(w.v, '^([^/]*)/(.*)$') as r(m)
      group by t2.id
    ) a on e.id = a.id
    where l.ref is not null;
  expected_outputs:
  - stream_plan

- name: self aggregate - shared table, joins on the left side, a self aggregate inside the right side
  before: [setup]
  sql: |
    with tt as (select * from t)
    select p.id, p.n, s.status, pv.v, a.items, a.last
    from tt p
    join st s on p.id = s.pid
    left join vt pv on p.id = pv.pid
    left join (
      select i.id, jsonb_agg(i.e order by i.o) as items, max(g.mx) as last
      from (select tt.id, x.e, x.o from tt cross join jsonb_array_elements(tt.j -> 'items') with ordinality as x(e, o)) i
      join (
        select tt.id, y.e ->> 'ref' as ref, max(r.x) as mx
        from tt cross join jsonb_array_elements(tt.j -> 'refs') as y(e) left join r on (y.e ->> 'n')::int = r.id
        group by tt.id, y.e ->> 'ref'
      ) g on g.id = i.id and (i.e ->> 'ref') = g.ref
      group by i.id
    ) a on p.id = a.id
    where s.status <> 'gone';
  expected_outputs:
  - stream_plan

