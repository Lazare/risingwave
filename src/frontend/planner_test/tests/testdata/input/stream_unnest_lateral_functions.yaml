# Tests for the per-row evaluation of correlated subqueries that read no table, only columns of
# the outer row through set-returning functions (`streaming_unnest_lateral_functions`):
# `LateralTableFunctionRule` and `UnnestArrayOfTableFunctionRule`; and a table joined back on its
# key with an aggregation of rows derived from itself: `SelfAggregateJoinRule`.
- id: setup
  sql: |
    set streaming_unnest_lateral_functions = true;
    create table t (id int primary key, s varchar, c varchar, j jsonb, arr int[], arr2 int[][], n int);
    create table u (k int, arr int[]);
    create table r (id int primary key, tid int, x int);
    create table b (k varchar primary key, v int);
    create table w (rid int primary key, id int, j jsonb);
    create view tv as select id, n from t where c = 'k';
    create table rr (rid int primary key, eid int, ref varchar);
    create table st (pid int primary key, status varchar);
    create table vt (pid int primary key, v int);
    create table x (id int primary key, tid int);
  expected_outputs: []
- id: setup_off
  sql: |
    create table t (id int primary key, s varchar, c varchar, j jsonb, arr int[], arr2 int[][], n int);
  expected_outputs: []

- name: off by default - LEFT JOIN LATERAL over regexp_matches reads the outer side again for its domain
  before: [setup_off]
  sql: |
    select t.id, a.x from t left join lateral (select (regexp_matches(t.s, 'A([0-9]+)'))[1] as x) as a on true;
  expected_outputs:
  - stream_plan

- name: off by default - ARRAY of a set-returning function of the outer row
  before: [setup_off]
  sql: |
    select t.id, array(select jsonb_array_elements_text(coalesce(t.j -> 'xs', '[]'::jsonb))) as xs from t;
  expected_outputs:
  - stream_plan

# Rewritten: LEFT JOIN LATERAL, an outer ProjectSet emulated with generate_series(1, 1).

- name: two LEFT JOIN LATERAL over regexp_matches, with a filter on the outer side
  before: [setup]
  sql: |
    select t.id, a.x, b.y
    from t
    left join lateral (select (regexp_matches(t.s, 'A([0-9]+)'))[1] as x) as a on true
    left join lateral (select (regexp_matches(t.s, 'B([0-9]+)'))[1] as y) as b on true
    where t.c = 'K';
  expected_outputs:
  - stream_plan

- name: LEFT JOIN of a table function of the outer row
  before: [setup]
  sql: |
    select t.id, e.x from t left join jsonb_array_elements_text(t.j -> 'xs') as e(x) on true;
  expected_outputs:
  - stream_plan

- name: LEFT JOIN of unnest WITH ORDINALITY, the ordinality is NULL on the padded row
  before: [setup]
  sql: |
    select t.id, x.v, x.o from t left join unnest(t.arr) with ordinality as x(v, o) on true;
  expected_outputs:
  - stream_plan

- name: LEFT JOIN LATERAL with a constant column, NULL on the padded row
  before: [setup]
  sql: |
    select t.id, l.one, l.v from t left join lateral (select 1 as one, unnest(t.arr) as v) as l on true;
  expected_outputs:
  - stream_plan

- name: LEFT JOIN of generate_series bounded by a column of the outer row
  before: [setup]
  sql: |
    select t.id, g.i from t left join generate_series(1, t.n) as g(i) on true;
  expected_outputs:
  - stream_plan

- name: LEFT JOIN of jsonb_each, a table function returning a struct
  before: [setup]
  sql: |
    select t.id, e.key, e.value from t left join jsonb_each(t.j -> 'obj') as e on true;
  expected_outputs:
  - stream_plan

