# The kept lookup already outputs the column that the removed one reads.
- name: two inner lookups of the same column
  before: [setup]
  sql: |
    select f.id, a.name, b.name as name2 from f join d a on f.dim_id = a.id join d b on f.dim_id = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream
- name: lookups of the same column with an outer join in between
  before: [setup]
  sql: |
    select f.id, a.name, e.code, b.name as name2, b.id as id2
    from f join d a on f.dim_id = a.id left join e on f.other_id = e.id left join d b on f.dim_id = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream
- name: left lookups of the same columns with an outer join in between
  before: [setup]
  sql: |
    select f.id, a.name, a.id as id1, e.code, b.name as name2, b.id as id2
    from f left join d a on f.dim_id = a.id left join e on f.other_id = e.id left join d b on f.dim_id = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream

# Semi and anti joins: the lookup only tells whether the row is found.
- name: exists on the same table with a filter
  before: [setup]
  sql: |
    select a.id, a.name from d a where exists (select 1 from da b where b.id = a.id);
  expected_outputs:
  - optimized_logical_plan_for_stream
  - stream_plan
- name: not exists on the same table with a filter
  before: [setup]
  sql: |
    select a.id, a.name from d a where not exists (select 1 from da b where b.id = a.id);
  expected_outputs:
  - optimized_logical_plan_for_stream
  - stream_plan
- name: not exists on the same table without filter - only a NULL key has no match
  before: [setup]
  sql: |
    select a.id, a.name from d a where not exists (select 1 from d b where b.id = a.id);
  expected_outputs:
  - optimized_logical_plan_for_stream
- name: not exists on a table that an inner lookup already reads
  before: [setup]
  sql: |
    select f.id, a.name from f join d a on f.dim_id = a.id
    where not exists (select 1 from d b where b.id = f.dim_id and b.grp = 2);
  expected_outputs:
  - optimized_logical_plan_for_stream
- name: not exists on a table that a left lookup already reads
  before: [setup]
  sql: |
    select f.id, a.name from f left join d a on f.dim_id = a.id
    where not exists (select 1 from da b where b.id = f.dim_id);
  expected_outputs:
  - optimized_logical_plan_for_stream
- name: kept - not exists on a column that is not the key
  before: [setup]
  sql: |
    select a.id, a.name from d a where not exists (select 1 from d b where b.grp = a.id);
  expected_outputs:
  - optimized_logical_plan_for_stream

# The kept lookup is below an aggregation, a top-1 or a shared sub-plan.
- name: lookup of a row that an aggregation grouped by its key already read
  before: [setup]
  sql: |
    select t.dim_id, t.total, b.grp
    from (select f.dim_id, sum(f.amt) as total from f join d a on f.dim_id = a.id group by f.dim_id) t
    left join d b on t.dim_id = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream
  - stream_plan
- name: lookup above an aggregation grouped by the key and another column
  before: [setup]
  sql: |
    select t.dim_id, t.label, t.total, b.grp, b.name
    from (select f.dim_id, f.label, sum(f.amt) as total from f join d a on f.dim_id = a.id where a.active group by f.dim_id, f.label) t
    join d b on t.dim_id = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream
- name: left lookup above an aggregation over a left lookup of the same row
  before: [setup]
  sql: |
    select t.dim_id, t.n, t.total, b.grp
    from (select f.dim_id, max(a.name) as n, sum(f.amt) as total from f left join d a on f.dim_id = a.id group by f.dim_id) t
    left join d b on t.dim_id = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream
- name: kept - lookup above an aggregation that is not grouped by the key
  before: [setup]
  sql: |
    select t.label, t.dim, b.grp
    from (select f.label, max(f.dim_id) as dim from f join d a on f.dim_id = a.id group by f.label) t
    left join d b on t.dim = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream
- name: lookup above a top-1 per group
  before: [setup]
  sql: |
    select x.other_id, x.name, b.grp
    from (select distinct on (f.other_id) f.other_id, f.dim_id, a.name from f join d a on f.dim_id = a.id) x
    left join d b on x.dim_id = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream
  - stream_plan
- name: lookup above a ranking that keeps the first row of each group
  before: [setup]
  sql: |
    select x.other_id, x.name, b.grp
    from (
      select other_id, dim_id, name from (
        select f.other_id, f.dim_id, a.name, row_number() over (partition by f.other_id order by f.amt desc) as rn
        from f left join d a on f.dim_id = a.id
      ) r where rn = 1
    ) x
    join d b on x.dim_id = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream
- name: lookup of a row that a shared sub-plan already outputs
  before: [setup]
  sql: |
    with v as (select f.id, f.dim_id, f.amt, a.name, a.grp from f join d a on f.dim_id = a.id)
    select x.id, x.grp as grp1, y.amt, b.grp as grp2
    from v x join v y on x.amt = y.id left join d b on x.dim_id = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream
- name: kept - lookup of a column that the shared sub-plan does not output
  before: [setup]
  sql: |
    with v as (select f.id, f.dim_id, f.amt, a.name from f join d a on f.dim_id = a.id)
    select x.id, x.name, y.amt, b.grp
    from v x join v y on x.amt = y.id left join d b on x.dim_id = b.id;
  expected_outputs:
  - optimized_logical_plan_for_stream

# Lookups that are kept.
