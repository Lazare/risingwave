# Shared sub-plans.
- name: shared empty relation used twice
  before:
  - setup
  sql: |
    with c as (select * from t where v1 = 1 and v1 = 2)
    select a.v1, b.v2 from c a join c b on a.v1 = b.v1;
  expected_outputs:
  - stream_plan
- name: shared relation with one empty consumer
  before:
  - setup
  sql: |
    with c as (select v1, v2 from t)
    select * from c where v1 = 1 and v1 = 2
    union all
    select * from c where v2 = 7;
  expected_outputs:
  - stream_plan

# Constant propagation: a column known to hold one constant is replaced with it.
- name: constant propagated into another conjunct
  before:
  - setup
  sql: |
    select v1, v2 from t where v1 = 3 and v2 > v1;
  expected_outputs:
  - stream_plan
- name: constant propagated into a projection
  before:
  - setup
  sql: |
    select v1, v1 + v2 as total from t where v1 = 3;
  expected_outputs:
  - stream_plan
- name: constant propagated through an equality between columns, then a contradiction
  before:
  - setup
  sql: |
    select v1, v2 from t where v1 = 3 and v2 = v1 and v2 = 4;
  expected_outputs:
  - stream_plan
- name: constant propagated from a subquery into an expression of the outer filter
  before:
  - setup
  sql: |
    select v1, v2 from (select v1, v2 from t where v1 = 3) x where v1 + v2 > 10;
  expected_outputs:
  - stream_plan
- name: constant column of a union branch in a case expression
  before:
  - setup
  sql: |
    select case when kind = 'a' then v else -v end as r, case when kind = 'b' then 1 when v > 0 then 2 else 3 end as c
    from (select 'a' as kind, v1 as v from t union all select 'b' as kind, k as v from s) u where kind = 'a';
  expected_outputs:
  - stream_plan
- name: constant group key removed by a having clause
  before:
  - setup
  sql: |
    select kind, count(*) as cnt from (select 'a' as kind, v1 from t) x group by kind having kind = 'b';
  expected_outputs:
  - stream_plan
- name: constant propagated through an inner join
  before:
  - setup
  sql: |
    select t.v1, s.w, t.v2 + s.k as total from t join s on t.v1 = s.k where t.v1 = 3;
  expected_outputs:
  - stream_plan
- name: kept - a plain constant column stays a column
  before:
  - setup
  sql: |
    select v1, v2 from t where v1 = 3;
  expected_outputs:
  - stream_plan
- name: kept - constant of the optional side of a left join is not propagated above it
  before:
  - setup
  sql: |
    select t.v1, s.w, s.w + 1 as w1, s.w is null as missing
    from t left join (select * from s where w = 1) s on t.v1 = s.k;
  expected_outputs:
  - stream_plan
- name: kept - temporal filter on a constant column
  before:
  - setup
  sql: |
    select v1, ts from t where ts = '2026-01-01 00:00:00' and ts > now() - interval '1 hour';
  expected_outputs:
  - stream_plan

