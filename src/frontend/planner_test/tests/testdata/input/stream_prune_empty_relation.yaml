    select count(*) as c1, count(v1) as c2, sum(v1) as s1, min(v3) as m1, max(ts) as m2, avg(v2) as a1,
      bool_and(b) as b1, string_agg(v3, ',' order by v3) as sa
    from t where v1 = 1 and v1 = 2;
  expected_outputs:
  - optimized_logical_plan_for_stream
  - stream_plan
- name: distinct agg without group key over an empty input
