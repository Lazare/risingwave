      └─BatchLookupJoin { type: LeftOuter, predicate: f.dim_id = d.id, output: [f.id, d.name, d.grp], lookup table: d }
        └─BatchExchange { order: [], dist: UpstreamHashShard(f.dim_id) }
          └─BatchScan { table: f, columns: [f.id, f.dim_id], distribution: UpstreamHashShard(f.id) }
