    └─BatchExchange { order: [], dist: Single }
      └─BatchSimpleAgg { aggs: [sum(f.amt), count] }
        └─BatchScan { table: f, columns: [f.amt], scan_ranges: [f.id = Int32(1)], distribution: SomeShard }
