- name: kept - two reads of an aggregation of a CTE, which batch does not share
  before:
  - setup_lookups
  sql: |
    with q as (select grp, count(*) as c, max(name) as m from d group by grp)
    select f.id, q1.c, q2.m from f join q q1 on f.other_id = q1.grp join q q2 on f.other_id = q2.grp;
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchHashJoin { type: Inner, predicate: f.other_id = d.grp, output: [f.id, count, max(d.name)] }
      ├─BatchHashJoin { type: Inner, predicate: f.other_id = d.grp, output: [f.id, f.other_id, count] }
      │ ├─BatchExchange { order: [], dist: HashShard(f.other_id) }
      │ │ └─BatchScan { table: f, columns: [f.id, f.other_id], distribution: UpstreamHashShard(f.id) }
      │ └─BatchHashAgg { group_key: [d.grp], aggs: [count] }
      │   └─BatchExchange { order: [], dist: HashShard(d.grp) }
      │     └─BatchScan { table: d, columns: [d.grp], distribution: SomeShard }
      └─BatchHashAgg { group_key: [d.grp], aggs: [max(d.name)] }
        └─BatchExchange { order: [], dist: HashShard(d.grp) }
          └─BatchScan { table: d, columns: [d.name, d.grp], distribution: SomeShard }
- name: all - lookups of a stack of views, unused ones removed, the rest merged
  before:
  - setup_all
  sql: |
    select v2.id, v2.grp from v2 left join e on v2.dim_id = e.id where v2.amt > 0 and v2.amt > 2;
  optimized_logical_plan_for_batch: |-
    LogicalJoin { type: LeftOuter, on: (f.dim_id = d.id), output: [f.id, d.grp] }
    ├─LogicalScan { table: f, output_columns: [f.id, f.dim_id], required_columns: [f.id, f.dim_id, f.amt], predicate: (f.amt > 2:Int32) }
    └─LogicalScan { table: d, columns: [d.id, d.grp] }
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchLookupJoin { type: LeftOuter, predicate: f.dim_id = d.id, output: [f.id, d.grp], lookup table: d }
      └─BatchExchange { order: [], dist: UpstreamHashShard(f.dim_id) }
        └─BatchProject { exprs: [f.id, f.dim_id] }
          └─BatchFilter { predicate: (f.amt > 2:Int32) }
            └─BatchScan { table: f, columns: [f.id, f.dim_id, f.amt], distribution: UpstreamHashShard(f.id) }
- name: all - aggregation on the key of a merged lookup
  before:
  - setup_all
  sql: |
    select id, max(name) as n, sum(grp) as g from v2 group by id;
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
