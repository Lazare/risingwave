      │ └─BatchScan { table: f, columns: [f.id, f.dim_id, f.amt], distribution: UpstreamHashShard(f.id) }
      └─BatchExchange { order: [], dist: HashShard(d.id) }
        └─BatchScan { table: d, columns: [d.id], distribution: UpstreamHashShard(d.id) }
