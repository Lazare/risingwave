    BatchExchange { order: [], dist: Single }
    └─BatchProject { exprs: [f.id, f.amt] }
      └─BatchFilter { predicate: (row_number = 1:Int32) }
        └─BatchOverWindow { window_functions: [row_number() OVER(PARTITION BY f.id ORDER BY f.amt ASC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)] }
          └─BatchSort { order: [f.id ASC, f.amt ASC] }
            └─BatchScan { table: f, columns: [f.id, f.amt], distribution: UpstreamHashShard(f.id) }
