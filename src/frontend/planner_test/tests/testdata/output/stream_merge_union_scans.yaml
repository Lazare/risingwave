              └─LogicalScan { table: h, columns: [h.k, h.a], predicate: ((h.a > 0:Int32) OR (h.a > 10:Int32)) }
  stream_plan: |-
    StreamMaterialize { columns: [k, st], stream_key: [k], pk_columns: [k], pk_conflict: NoCheck }
    └─StreamProject { exprs: [h.k, $expr1] }
      └─StreamGroupTopN { order: [$expr2 DESC], limit: 1, offset: 0, group_key: [h.k] }
        └─StreamExchange { dist: HashShard(h.k) }
          └─StreamProject { exprs: [h.k, Case((flag = 0:Int64), 'low':Varchar, 'high':Varchar) as $expr1, Case((flag = 0:Int64), 1:Int32, 2:Int32) as $expr2, h.r, flag] }
            └─StreamFilter { predicate: Case((flag = 0:Int64), (h.a > 0:Int32), (flag = 1:Int64), (h.a > 10:Int32)) }
              └─StreamProject { exprs: [h.k, h.a, flag, h.r] }
                └─StreamExpand { column_subsets: [[h.k, h.a], [h.k, h.a]] }
                  └─StreamFilter { predicate: ((h.a > 0:Int32) OR (h.a > 10:Int32)) }
                    └─StreamTableScan { table: h, columns: [h.k, h.a, h.r], stream_scan_type: SnapshotBackfill, stream_key: [h.r], pk: [r], dist: UpstreamHashShard(h.r) }
- name: kept - a branch with a temporal filter, the other two are merged
  before:
  - setup
  sql: |
    select k, a from t where a > 0
    union all
    select k, b from t where b > 0
    union all
    select k, a from t where ts > now() - interval '1 day';
  optimized_logical_plan_for_stream: |-
    LogicalUnion { all: true }
    ├─LogicalProject { exprs: [t.k, Case((flag = 0:Int64), t.a, t.b) as $expr1] }
    │ └─LogicalFilter { predicate: Case((flag = 0:Int64), (t.a > 0:Int32), (flag = 1:Int64), (t.b > 0:Int32)) }
    │   └─LogicalProject { exprs: [t.k, t.a, t.b, flag] }
    │     └─LogicalExpand { column_subsets: [[t.k, t.a, t.b], [t.k, t.a, t.b]] }
    │       └─LogicalScan { table: t, columns: [t.k, t.a, t.b], predicate: ((t.a > 0:Int32) OR (t.b > 0:Int32)) }
    └─LogicalJoin { type: LeftSemi, on: (t.ts > $expr2), output: [t.k, t.a] }
      ├─LogicalScan { table: t, columns: [t.k, t.a, t.ts] }
      └─LogicalProject { exprs: [(now - '1 day':Interval) as $expr2] }
        └─LogicalNow { output: [now] }
- name: kept - a table with a watermark
  before:
  - setup
  sql: |
    select k, ts from w where v > 0
    union all
    select v, ts from w where v < 0;
  optimized_logical_plan_for_stream: |-
    LogicalUnion { all: true }
    ├─LogicalScan { table: w, output_columns: [w.k, w.ts], required_columns: [w.k, w.ts, w.v], predicate: (w.v > 0:Int32) }
    └─LogicalScan { table: w, columns: [w.v, w.ts], predicate: (w.v < 0:Int32) }
- name: kept - branches over different tables
  before:
  - setup
  sql: |
    select k, a from t where a > 0
    union all
    select k, a from u where a > 0;
  optimized_logical_plan_for_stream: |-
    LogicalUnion { all: true }
    ├─LogicalScan { table: t, columns: [t.k, t.a], predicate: (t.a > 0:Int32) }
    └─LogicalScan { table: u, columns: [u.k, u.a], predicate: (u.a > 0:Int32) }
- name: kept - a branch with a join
  before:
  - setup
  sql: |
    select t.k, t.a from t where t.a > 0
    union all
    select t.k, u.c from t join u on t.k = u.k;
  optimized_logical_plan_for_stream: |-
    LogicalUnion { all: true }
    ├─LogicalScan { table: t, columns: [t.k, t.a], predicate: (t.a > 0:Int32) }
    └─LogicalJoin { type: Inner, on: (t.k = u.k), output: [t.k, u.c] }
      ├─LogicalScan { table: t, columns: [t.k] }
      └─LogicalScan { table: u, columns: [u.k, u.c] }
- name: kept - a branch with a table function
  before:
  - setup
  sql: |
    select k, unnest(array[a, b]) as v from t
    union all
    select k, a from t where a is null;
  optimized_logical_plan_for_stream: |-
    LogicalUnion { all: true }
    ├─LogicalProject { exprs: [t.k, Unnest(Array($1, $2))] }
    │ └─LogicalProjectSet { select_list: [$0, Unnest(Array($1, $2))] }
    │   └─LogicalScan { table: t, columns: [t.k, t.a, t.b] }
    └─LogicalScan { table: t, columns: [t.k, t.a], predicate: IsNull(t.a) }
- name: kept - a shared sub-plan that is not a scan
  before:
  - setup
  sql: |
    with c as (select t.k, t.a, u.c from t join u on t.a = u.a)
    select k, a from c where c > 0
    union all
    select k, c from c where a > 0;
  optimized_logical_plan_for_stream: |-
    LogicalUnion { all: true }
    ├─LogicalProject { exprs: [t.k, t.a] }
    │ └─LogicalFilter { predicate: (u.c > 0:Int32) }
    │   └─LogicalShare { id: 2 }
    │     └─LogicalJoin { type: Inner, on: (t.a = u.a) AND ((u.c > 0:Int32) OR (t.a > 0:Int32)), output: [t.k, t.a, u.c] }
    │       ├─LogicalScan { table: t, columns: [t.k, t.a] }
    │       └─LogicalScan { table: u, columns: [u.a, u.c] }
    └─LogicalProject { exprs: [t.k, u.c] }
      └─LogicalFilter { predicate: (t.a > 0:Int32) }
        └─LogicalShare { id: 2 }
          └─LogicalJoin { type: Inner, on: (t.a = u.a) AND ((u.c > 0:Int32) OR (t.a > 0:Int32)), output: [t.k, t.a, u.c] }
            ├─LogicalScan { table: t, columns: [t.k, t.a] }
            └─LogicalScan { table: u, columns: [u.a, u.c] }
