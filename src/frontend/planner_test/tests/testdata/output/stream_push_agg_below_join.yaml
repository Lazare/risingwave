      └─StreamSimpleAgg [append_only] { aggs: [sum0(count), sum(sum(f.x)), count] }
        └─StreamExchange { dist: Single }
          └─StreamStatelessSimpleAgg { aggs: [count, sum(f.x)] }
            └─StreamHashJoin { type: Inner, predicate: f.k = d.id, output: [f.x, f.id, f.k, d.id] }
              ├─StreamExchange { dist: HashShard(f.k) }
              │ └─StreamTableScan { table: f, columns: [f.k, f.x, f.id], stream_scan_type: SnapshotBackfill, stream_key: [f.id], pk: [id], dist: UpstreamHashShard(f.id) }
              └─StreamExchange { dist: HashShard(d.id) }
                └─StreamTableScan { table: d, columns: [d.id], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
- name: a non-equi condition on a column that is not grouped
  before:
