            │ └─StreamTableScan { table: f, columns: [f.k, f.x, f.id], stream_scan_type: SnapshotBackfill, stream_key: [f.id], pk: [id], dist: UpstreamHashShard(f.id) }
            └─StreamExchange { dist: HashShard(d.id) }
              └─StreamTableScan { table: d, columns: [d.id, d.region], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
- name: full join
  before:
  - setup
  sql: |
    select f.k, d.name, sum(f.x) as s from f full join d on f.k = d.id group by f.k, d.name;
  stream_plan: |-
    StreamMaterialize { columns: [k, name, s], stream_key: [k, name], pk_columns: [k, name], pk_conflict: NoCheck }
    └─StreamProject { exprs: [f.k, d.name, sum(f.x)] }
      └─StreamHashAgg { group_key: [f.k, d.name], aggs: [sum(f.x), count] }
        └─StreamExchange { dist: HashShard(f.k, d.name) }
          └─StreamFilter { predicate: ((IsNotNull(f.id) OR IsNotNull(d.id)) OR IsNotNull(f.k)) }
            └─StreamHashJoin { type: FullOuter, predicate: f.k = d.id, output: [f.k, d.name, f.x, f.id, d.id] }
              ├─StreamExchange { dist: HashShard(f.k) }
              │ └─StreamTableScan { table: f, columns: [f.k, f.x, f.id], stream_scan_type: SnapshotBackfill, stream_key: [f.id], pk: [id], dist: UpstreamHashShard(f.id) }
              └─StreamExchange { dist: HashShard(d.id) }
                └─StreamTableScan { table: d, columns: [d.id, d.name], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
- name: left join with the aggregated side optional
  before:
  - setup
