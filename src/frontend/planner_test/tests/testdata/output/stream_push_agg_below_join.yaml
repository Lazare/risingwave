      └─StreamHashJoin { type: LeftOuter, predicate: nf.k = nd.id AND (nf.k::Varchar <> nd.name), output: [nf.k, nd.name, nf.id, nd.id] }
        ├─StreamExchange { dist: HashShard(nf.k) }
        │ └─StreamTableScan { table: nf, columns: [nf.k, nf.id], stream_scan_type: SnapshotBackfill, stream_key: [nf.id], pk: [id], dist: UpstreamHashShard(nf.id) }
        └─StreamExchange { dist: HashShard(nd.id) }
          └─StreamTableScan { table: nd, columns: [nd.id, nd.name], stream_scan_type: SnapshotBackfill, stream_key: [nd.id], pk: [id], dist: UpstreamHashShard(nd.id) }
- name: the aggregated side is unique on the new group key (nothing to reduce)
  before:
  - setup
  sql: |
    select f.id, f.k, d.name, sum(f.x) as s from f left join d on f.k = d.id group by f.id, f.k, d.name;
