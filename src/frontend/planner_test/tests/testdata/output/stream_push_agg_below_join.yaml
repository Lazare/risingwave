        └─StreamExchange { dist: HashShard(f.id, d.name) }
          └─StreamHashJoin { type: LeftOuter, predicate: f.k = d.id, output: [f.id, f.k, d.name, f.x, d.id] }
            ├─StreamExchange { dist: HashShard(f.k) }
            │ └─StreamTableScan { table: f, columns: [f.id, f.k, f.x], stream_scan_type: SnapshotBackfill, stream_key: [f.id], pk: [id], dist: UpstreamHashShard(f.id) }
            └─StreamExchange { dist: HashShard(d.id) }
              └─StreamTableScan { table: d, columns: [d.id, d.name], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
- name: a table with a watermark (an aggregation that may emit on window close)
  before:
  - setup
  sql: |
    select t.k, d.name, count(*) as n from t left join d on t.k = d.id group by t.k, d.name;
  stream_plan: |-
    StreamMaterialize { columns: [k, name, n], stream_key: [k, name], pk_columns: [k, name], pk_conflict: NoCheck }
    └─StreamHashAgg { group_key: [t.k, d.name], aggs: [count] }
      └─StreamHashJoin { type: LeftOuter, predicate: t.k = d.id, output: [t.k, d.name, t._row_id, d.id] }
        ├─StreamExchange { dist: HashShard(t.k) }
        │ └─StreamTableScan { table: t, columns: [t.k, t._row_id], stream_scan_type: SnapshotBackfill, stream_key: [t._row_id], pk: [_row_id], dist: UpstreamHashShard(t._row_id) }
        └─StreamExchange { dist: HashShard(d.id) }
          └─StreamTableScan { table: d, columns: [d.id, d.name], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
- name: temporal join
  before:
  - setup
  sql: |
    select ta.k, d.name, sum(ta.x) as s from ta left join d for system_time as of proctime() on ta.k = d.id group by ta.k, d.name;
  stream_plan: |-
    StreamMaterialize { columns: [k, name, s], stream_key: [k, name], pk_columns: [k, name], pk_conflict: NoCheck }
    └─StreamProject { exprs: [ta.k, d.name, sum(ta.x)] }
      └─StreamHashAgg [append_only] { group_key: [ta.k, d.name], aggs: [sum(ta.x), count] }
        └─StreamTemporalJoin { type: LeftOuter, append_only: true, predicate: ta.k = d.id, nested_loop: false, output: [ta.k, d.name, ta.x, ta._row_id, d.id] }
          ├─StreamExchange { dist: HashShard(ta.k) }
          │ └─StreamTableScan { table: ta, columns: [ta.k, ta.x, ta._row_id], stream_scan_type: ArrangementBackfill, stream_key: [ta._row_id], pk: [_row_id], dist: UpstreamHashShard(ta._row_id) }
          └─StreamExchange [no_shuffle] { dist: UpstreamHashShard(d.id) }
            └─StreamTableScan { table: d, columns: [d.id, d.name], stream_scan_type: UpstreamOnly, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
- name: a group key that mixes both sides
  before:
  - setup
  sql: |
    select f.k + d.region as g, count(*) as n from f join d on f.k = d.id group by f.k + d.region;
  stream_plan: |-
    StreamMaterialize { columns: [g, n], stream_key: [g], pk_columns: [g], pk_conflict: NoCheck }
    └─StreamHashAgg { group_key: [$expr1], aggs: [count] }
      └─StreamExchange { dist: HashShard($expr1) }
        └─StreamProject { exprs: [(f.k + d.region) as $expr1, f.id, f.k] }
          └─StreamHashJoin { type: Inner, predicate: f.k = d.id, output: [f.k, d.region, f.id, d.id] }
            ├─StreamExchange { dist: HashShard(f.k) }
            │ └─StreamTableScan { table: f, columns: [f.k, f.id], stream_scan_type: SnapshotBackfill, stream_key: [f.id], pk: [id], dist: UpstreamHashShard(f.id) }
            └─StreamExchange { dist: HashShard(d.id) }
              └─StreamTableScan { table: d, columns: [d.id, d.region], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
