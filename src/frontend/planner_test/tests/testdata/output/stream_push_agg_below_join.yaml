          ├─StreamExchange { dist: HashShard(d.id) }
          │ └─StreamTableScan { table: d, columns: [d.id, d.name], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
          └─StreamExchange { dist: HashShard(f.k) }
            └─StreamTableScan { table: f, columns: [f.k, f.x, f.id], stream_scan_type: SnapshotBackfill, stream_key: [f.id], pk: [id], dist: UpstreamHashShard(f.id) }
- name: no group key
  before:
  - setup
  sql: |
    select count(*) as n, sum(f.x) as s from f join d on f.k = d.id;
