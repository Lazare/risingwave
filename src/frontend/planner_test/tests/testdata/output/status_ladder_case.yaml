      select k, st, row_number() over (partition by k order by p desc) as rn from (
        select f.k, 'matched' as st, 1 as p from f join g on f.k = g.k where g.r > 2
        union all select f.k, 'paid', 2 from f join g on f.k = g.k where f.amt > 0
        union all select id, 'new', 0 from e
      ) u
    ) x where rn = 1;
  optimized_logical_plan_for_stream: |-
    LogicalProject { exprs: [f.k, $expr1] }
    └─LogicalTopN { order: [$expr2 DESC], limit: 1, offset: 0, group_key: [f.k] }
      └─LogicalUnion { all: true }
        ├─LogicalProject { exprs: [f.k, Case((f.amt > 0:Int32), 'paid':Varchar, (g.r > 2:Int32), 'matched':Varchar) as $expr1, Case((f.amt > 0:Int32), 2:Int32, (g.r > 2:Int32), 1:Int32) as $expr2] }
        │ └─LogicalJoin { type: Inner, on: (f.k = g.k) AND ((g.r > 2:Int32) OR (f.amt > 0:Int32)) AND ((f.amt > 0:Int32) OR (g.r > 2:Int32)), output: [f.k, f.amt, g.r] }
        │   ├─LogicalScan { table: f, columns: [f.k, f.amt] }
        │   └─LogicalScan { table: g, columns: [g.r, g.k] }
        └─LogicalProject { exprs: [e.id, 'new':Varchar, 0:Int32] }
          └─LogicalScan { table: e, columns: [e.id] }
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchProject { exprs: [e.id, 'new':Varchar] }
      └─BatchFilter { predicate: (row_number = 1:Int32) }
        └─BatchProject { exprs: [e.id, 'new':Varchar, row_number] }
          └─BatchOverWindow { window_functions: [row_number() OVER(PARTITION BY e.id ORDER BY 0:Int32 DESC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)] }
            └─BatchExchange { order: [e.id ASC, 0:Int32 DESC], dist: HashShard(e.id) }
              └─BatchSort { order: [e.id ASC, 0:Int32 DESC] }
                └─BatchUnion { all: true }
                  ├─BatchExchange { order: [], dist: Single }
                  │ └─BatchProject { exprs: [e.id, 'new':Varchar, 0:Int32] }
                  │   └─BatchScan { table: e, columns: [e.id], distribution: UpstreamHashShard(e.id) }
                  └─BatchExchange { order: [], dist: Single }
                    └─BatchProject { exprs: [f.k, Case((0:Int32 = 0:Int32), 'matched':Varchar, (0:Int32 = 1:Int32), 'paid':Varchar) as $expr2, Case((0:Int32 = 0:Int32), 1:Int32, (0:Int32 = 1:Int32), 2:Int32) as $expr3] }
                      └─BatchHashJoin { type: Inner, predicate: g.k = f.k AND ((0:Int32 = 0:Int32) OR ((0:Int32 = 1:Int32) AND $expr1)), output: [0:Int32, f.k] }
                        ├─BatchExchange { order: [], dist: HashShard(g.k) }
                        │ └─BatchUnion { all: true }
                        │   ├─BatchExchange { order: [], dist: Single }
                        │   │ └─BatchProject { exprs: [g.k, 0:Int32] }
                        │   │   └─BatchScan { table: g, columns: [g.k], scan_ranges: [g.r > Int32(2)], distribution: SomeShard }
                        │   └─BatchExchange { order: [], dist: Single }
                        │     └─BatchProject { exprs: [g.k, 1:Int32] }
                        │       └─BatchScan { table: g, columns: [g.k], distribution: SomeShard }
                        └─BatchExchange { order: [], dist: HashShard(f.k) }
                          └─BatchProject { exprs: [f.k, f.k, (f.amt > 0:Int32) as $expr1] }
                            └─BatchScan { table: f, columns: [f.k, f.amt], distribution: SomeShard }
  stream_plan: |-
    StreamMaterialize { columns: [k, st], stream_key: [k], pk_columns: [k], pk_conflict: NoCheck }
    └─StreamProject { exprs: [f.k, $expr1] }
      └─StreamGroupTopN { order: [$expr2 DESC], limit: 1, offset: 0, group_key: [f.k] }
        └─StreamExchange { dist: HashShard(f.k) }
          └─StreamUnion { all: true }
            ├─StreamExchange { dist: HashShard(f.r, g.r, f.k, 0:Int32) }
            │ └─StreamProject { exprs: [f.k, Case((f.amt > 0:Int32), 'paid':Varchar, (g.r > 2:Int32), 'matched':Varchar) as $expr1, Case((f.amt > 0:Int32), 2:Int32, (g.r > 2:Int32), 1:Int32) as $expr2, f.r, g.r, f.k, 0:Int32] }
            │   └─StreamFilter { predicate: ((g.r > 2:Int32) OR (f.amt > 0:Int32)) AND ((f.amt > 0:Int32) OR (g.r > 2:Int32)) }
            │     └─StreamHashJoin { type: Inner, predicate: f.k = g.k, output: all }
            │       ├─StreamExchange { dist: HashShard(f.k) }
            │       │ └─StreamTableScan { table: f, columns: [f.k, f.amt, f.r], stream_scan_type: SnapshotBackfill, stream_key: [f.r], pk: [r], dist: UpstreamHashShard(f.r) }
            │       └─StreamExchange { dist: HashShard(g.k) }
            │         └─StreamTableScan { table: g, columns: [g.r, g.k], stream_scan_type: SnapshotBackfill, stream_key: [g.r], pk: [r], dist: UpstreamHashShard(g.r) }
            └─StreamExchange { dist: HashShard(e.id, null:Int32, null:Int32, 1:Int32) }
              └─StreamProject { exprs: [e.id, 'new':Varchar, 0:Int32, e.id, null:Int32, null:Int32, 1:Int32] }
                └─StreamTableScan { table: e, columns: [e.id], stream_scan_type: SnapshotBackfill, stream_key: [e.id], pk: [id], dist: UpstreamHashShard(e.id) }
