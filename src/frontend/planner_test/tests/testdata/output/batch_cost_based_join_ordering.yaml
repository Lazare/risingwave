- name: twelve inputs (greedy ordering beyond ten)
  before:
  - tables
  sql: |
    set batch_cost_based_join_ordering = true;
    select f.id, x1.a, x2.a, x3.b, x4.b, x5.c, x6.c, x7.x, x8.x, x9.x, x10.b, x11.a
    from d1 x1
    join f on f.d1_id = x1.id
    join d1 x2 on f.v = x2.id
    join d2 x3 on f.d2_id = x3.id
    join d2 x4 on f.w = x4.id
    join d3 x5 on f.d3_id = x5.id
    join d3 x6 on x1.k = x6.id
    join h x7 on x2.k = x7.id
    join g x8 on x3.k = x8.id
    join h x9 on x4.k = x9.id
    join d2 x10 on x7.y = x10.id
    join d1 x11 on x8.y = x11.id;
  batch_plan: |-
    BatchExchange { order: [], dist: Single }
    └─BatchHashJoin { type: Inner, predicate: f.d2_id = d2.id, output: [f.id, d1.a, d1.a, d2.b, d2.b, d3.c, d3.c, h.x, g.x, h.x, d2.b, d1.a] }
      ├─BatchExchange { order: [], dist: HashShard(f.d2_id) }
      │ └─BatchHashJoin { type: Inner, predicate: f.v = d1.id, output: [f.id, f.d2_id, d3.c, d1.a, d3.c, d2.b, h.x, d1.a, h.x, d2.b] }
      │   ├─BatchExchange { order: [], dist: HashShard(f.v) }
      │   │ └─BatchHashJoin { type: Inner, predicate: f.w = d2.id, output: [f.id, f.d2_id, f.v, d3.c, d1.a, d3.c, d2.b, h.x] }
      │   │   ├─BatchExchange { order: [], dist: HashShard(f.w) }
      │   │   │ └─BatchHashJoin { type: Inner, predicate: f.d1_id = d1.id, output: [f.id, f.d2_id, f.v, f.w, d3.c, d1.a, d3.c] }
      │   │   │   ├─BatchExchange { order: [], dist: HashShard(f.d1_id) }
      │   │   │   │ └─BatchLookupJoin { type: Inner, predicate: f.d3_id = d3.id, output: [f.id, f.d1_id, f.d2_id, f.v, f.w, d3.c], lookup table: d3 }
      │   │   │   │   └─BatchExchange { order: [], dist: UpstreamHashShard(f.d3_id) }
      │   │   │   │     └─BatchScan { table: f, columns: [f.id, f.d1_id, f.d2_id, f.d3_id, f.v, f.w], distribution: UpstreamHashShard(f.id) }
      │   │   │   └─BatchExchange { order: [], dist: HashShard(d1.id) }
      │   │   │     └─BatchLookupJoin { type: Inner, predicate: d1.k = d3.id, output: [d1.id, d1.a, d3.c], lookup table: d3 }
      │   │   │       └─BatchExchange { order: [], dist: UpstreamHashShard(d1.k) }
      │   │   │         └─BatchScan { table: d1, columns: [d1.id, d1.a, d1.k], distribution: UpstreamHashShard(d1.id) }
      │   │   └─BatchExchange { order: [], dist: HashShard(d2.id) }
      │   │     └─BatchLookupJoin { type: Inner, predicate: d2.k = h.id, output: [d2.id, d2.b, h.x], lookup table: h }
      │   │       └─BatchExchange { order: [], dist: UpstreamHashShard(d2.k) }
      │   │         └─BatchScan { table: d2, columns: [d2.id, d2.b, d2.k], distribution: UpstreamHashShard(d2.id) }
      │   └─BatchExchange { order: [], dist: HashShard(d1.id) }
      │     └─BatchHashJoin { type: Inner, predicate: d1.k = h.id, output: [d1.id, d1.a, h.x, d2.b] }
      │       ├─BatchExchange { order: [], dist: HashShard(d1.k) }
      │       │ └─BatchScan { table: d1, columns: [d1.id, d1.a, d1.k], distribution: UpstreamHashShard(d1.id) }
      │       └─BatchExchange { order: [], dist: HashShard(h.id) }
      │         └─BatchLookupJoin { type: Inner, predicate: h.y = d2.id, output: [h.id, h.x, d2.b], lookup table: d2 }
      │           └─BatchExchange { order: [], dist: UpstreamHashShard(h.y) }
      │             └─BatchScan { table: h, columns: [h.id, h.x, h.y], distribution: UpstreamHashShard(h.id) }
      └─BatchExchange { order: [], dist: HashShard(d2.id) }
        └─BatchLookupJoin { type: Inner, predicate: g.y = d1.id, output: [d2.id, d2.b, g.x, d1.a], lookup table: d1 }
          └─BatchExchange { order: [], dist: UpstreamHashShard(g.y) }
            └─BatchLookupJoin { type: Inner, predicate: d2.k = g.id, output: [d2.id, d2.b, g.x, g.y], lookup table: g }
              └─BatchExchange { order: [], dist: UpstreamHashShard(d2.k) }
                └─BatchScan { table: d2, columns: [d2.id, d2.b, d2.k], distribution: UpstreamHashShard(d2.id) }
  table_row_counts:
    d1: 100
    d2: 1000
    d3: 10
    f: 1000000
    g: 100000
    h: 50
