    └─BatchSimpleAgg { aggs: [max(max(g.x))] }
      └─BatchExchange { order: [], dist: Single }
        └─BatchSimpleAgg { aggs: [max(g.x)] }
          └─BatchScan { table: g, columns: [g.x], distribution: SomeShard }
  table_row_counts:
