            │   │     └─BatchScan { table: t1, columns: [t1.a, t1.b], distribution: SomeShard }
            │   └─BatchHashJoin { type: LeftSemi, predicate: t5.j = t6.k AND t1.a IS NOT DISTINCT FROM t1.a AND t1.b IS NOT DISTINCT FROM t1.b, output: [t1.a, t1.b, t2.d] }
