      │   └─StreamHashJoin { type: Inner, predicate: o2.eid = o1.id AND o3.fk = o1.id AND o4.fk = o1.id, output: [o4.id, max(o3.val), o2.eid, o3.fk, o4.id, o4.fk, o1.id] }
