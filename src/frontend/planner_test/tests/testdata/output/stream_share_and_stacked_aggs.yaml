      join (o3m c join (o4 r1 join o4 r on r1.link = r.id and r1.ok) on c.fk = r.fk)
      on x.id = r.fk and y.eid = c.fk
    union all
    select e.id, c.val from o5 e join o1 x on e.fk = x.id
