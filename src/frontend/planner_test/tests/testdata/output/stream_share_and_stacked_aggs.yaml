            │     └─StreamExchange { dist: HashShard(t.g) }
            │       └─StreamTableScan { table: t, columns: [t.g, t.v, t.id], stream_scan_type: SnapshotBackfill, stream_key: [t.id], pk: [id], dist: UpstreamHashShard(t.id) }
            └─StreamExchange { dist: HashShard(s.g, 1:Int32) }
              └─StreamProject { exprs: [s.g, sum(s.v), 1:Int32] }
                └─StreamHashAgg { group_key: [s.g], aggs: [sum(s.v), count] }
                  └─StreamExchange { dist: HashShard(s.g) }
                    └─StreamTableScan { table: s, columns: [s.g, s.v, s.id], stream_scan_type: SnapshotBackfill, stream_key: [s.id], pk: [id], dist: UpstreamHashShard(s.id) }
- name: kept - top-1 over a DISTINCT
  before:
  - setup_aggs
  sql: |
    select k, st from (
      select k, st, row_number() over (partition by k order by p desc) as rn from (
        select id as k, 'a' as st, 1 as p from a
        union all
        select g as k, 'b' as st, 2 as p from (select distinct g from s) as d
      ) as u
    ) as r where rn = 1;
  stream_plan: |-
    StreamMaterialize { columns: [k, st], stream_key: [k], pk_columns: [k], pk_conflict: NoCheck }
    └─StreamProject { exprs: [a.id, 'a':Varchar] }
      └─StreamGroupTopN { order: [1:Int32 DESC], limit: 1, offset: 0, group_key: [a.id] }
        └─StreamExchange { dist: HashShard(a.id) }
          └─StreamUnion { all: true }
            ├─StreamExchange { dist: HashShard(a.id, 0:Int32) }
            │ └─StreamProject { exprs: [a.id, 'a':Varchar, 1:Int32, 0:Int32] }
            │   └─StreamTableScan { table: a, columns: [a.id], stream_scan_type: SnapshotBackfill, stream_key: [a.id], pk: [id], dist: UpstreamHashShard(a.id) }
            └─StreamExchange { dist: HashShard(s.g, 1:Int32) }
              └─StreamProject { exprs: [s.g, 'b':Varchar, 2:Int32, 1:Int32], noop_update_hint: true }
                └─StreamHashAgg { group_key: [s.g], aggs: [count] }
                  └─StreamExchange { dist: HashShard(s.g) }
                    └─StreamTableScan { table: s, columns: [s.g, s.id], stream_scan_type: SnapshotBackfill, stream_key: [s.id], pk: [id], dist: UpstreamHashShard(s.id) }
- name: kept - semi join over a DISTINCT
  before:
  - setup_aggs
  sql: |
    select id from a where k in (select distinct g from s);
