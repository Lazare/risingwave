      │     │   │   ├─StreamFilter { predicate: IsNotNull(o3.fk) }
      │     │   │   │ └─StreamShare { id: 6 }
      │     │   │   │   └─StreamHashJoin { type: Inner, predicate: o2.eid = o3.fk, output: all }
