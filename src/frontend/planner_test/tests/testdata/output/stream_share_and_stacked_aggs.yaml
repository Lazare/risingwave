      │     │   │   └─StreamExchange { dist: HashShard(o4.fk) }
      │     │   │     └─StreamFilter { predicate: IsNotNull(o4.fk) }
      │     │   │       └─StreamTableScan { table: o4, columns: [o4.id, o4.fk], stream_scan_type: SnapshotBackfill, stream_key: [o4.id], pk: [id], dist: UpstreamHashShard(o4.id) }
