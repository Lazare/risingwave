      │     └─StreamExchange { dist: HashShard(o1.id, o1.id, o1.id) }
      │       └─StreamTableScan { table: o1, columns: [o1.id], stream_scan_type: SnapshotBackfill, stream_key: [o1.id], pk: [id], dist: UpstreamHashShard(o1.id) }
      └─StreamExchange { dist: HashShard(o5.id, o5.fk, o1.id, null:Int32, null:Int32, 1:Int32) }
