        │       └─StreamProject { exprs: [t.g, t.v::Int64 as $expr1, t.id] }
        │         └─StreamTableScan { table: t, columns: [t.g, t.v, t.id], stream_scan_type: SnapshotBackfill, stream_key: [t.id], pk: [id], dist: UpstreamHashShard(t.id) }
