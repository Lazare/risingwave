    StreamMaterialize { columns: [v1, x, t._row_id(hidden), _row_id(hidden)], stream_key: [t._row_id, _row_id, v1], pk_columns: [t._row_id, _row_id, v1], pk_conflict: NoCheck }
    └─StreamExchange { dist: HashShard(t.v1, t._row_id, _row_id) }
      └─StreamHashJoin { type: LeftOuter, predicate: t.v1 = *VALUES*_0.column_0, output: [t.v1, *VALUES*_0.column_0, t._row_id, _row_id] }
        ├─StreamExchange { dist: HashShard(t.v1) }
        │ └─StreamTableScan { table: t, columns: [t.v1, t._row_id], stream_scan_type: SnapshotBackfill, stream_key: [t._row_id], pk: [_row_id], dist: UpstreamHashShard(t._row_id) }
        └─StreamExchange { dist: HashShard(*VALUES*_0.column_0) }
          └─StreamValues { rows: [[1:Int32, 0:Int64]] }
- name: last_value of a constant, packed by the planner with another last_value
  before:
  - setup
  sql: |
    select v1, x from (
      select v1, last_value('set' order by ts) as op, last_value(v2 order by ts) as x from t group by v1
    ) z where op = 'set';
  optimized_logical_plan_for_stream: |-
    LogicalProject { exprs: [t.v1, Field(last_value($expr1 order_by(t.ts ASC)), 1:Int32) as $expr2] }
    └─LogicalAgg { group_key: [t.v1], aggs: [last_value($expr1 order_by(t.ts ASC))] }
      └─LogicalProject { exprs: [t.v1, t.ts, Row('set':Varchar, t.v2) as $expr1] }
        └─LogicalScan { table: t, columns: [t.v1, t.v2, t.ts] }
  stream_plan: |-
    StreamMaterialize { columns: [v1, x], stream_key: [v1], pk_columns: [v1], pk_conflict: NoCheck }
    └─StreamProject { exprs: [t.v1, Field(last_value($expr1 order_by(t.ts ASC)), 1:Int32) as $expr2] }
      └─StreamHashAgg { group_key: [t.v1], aggs: [last_value($expr1 order_by(t.ts ASC)), count] }
        └─StreamExchange { dist: HashShard(t.v1) }
          └─StreamProject { exprs: [t.v1, t.ts, Row('set':Varchar, t.v2) as $expr1, t._row_id] }
            └─StreamTableScan { table: t, columns: [t.v1, t.v2, t.ts, t._row_id], stream_scan_type: SnapshotBackfill, stream_key: [t._row_id], pk: [_row_id], dist: UpstreamHashShard(t._row_id) }
- name: last_value of a constant column of a view that tags its rows
  before:
  - setup
  sql: |
    with ops(op, k, x, ts) as (select 'set', v1, v2, ts from t),
    last as (select k, last_value(op order by ts) as op, last_value(x order by ts) as x, first_value(ts order by ts) as created from ops group by k)
    select k, x, created from last where op = 'set';
  optimized_logical_plan_for_stream: |-
    LogicalProject { exprs: [t.v1, Field(last_value($expr1 order_by(t.ts ASC)), 1:Int32) as $expr2, first_value(t.ts order_by(t.ts ASC))] }
    └─LogicalAgg { group_key: [t.v1], aggs: [last_value($expr1 order_by(t.ts ASC)), first_value(t.ts order_by(t.ts ASC))] }
      └─LogicalProject { exprs: [t.v1, t.ts, Row('set':Varchar, t.v2) as $expr1] }
        └─LogicalScan { table: t, columns: [t.v1, t.v2, t.ts] }
- name: max and min of a constant - the group becomes a distinct
  before:
  - setup
  sql: |
    select v1 from (select v1, max('a') as hi, min(1) as lo from t group by v1) z where hi = 'a' and lo = 1;
  optimized_logical_plan_for_stream: |-
    LogicalAgg { group_key: [t.v1], aggs: [] }
    └─LogicalScan { table: t, columns: [t.v1] }
- name: aggregate of a constant compared with another value - the group is empty
  before:
  - setup
  sql: |
    select v1 from (select v1, last_value('set' order by ts) as op from t group by v1) z where op = 'delete';
  optimized_logical_plan_for_stream: 'LogicalValues { rows: [], schema: Schema { fields: [t.v1:Int32] } }'
- name: kept - aggregate of a constant with a filter clause, which can be NULL
  before:
  - setup
  sql: |
    select v1 from (select v1, max('a') filter (where v2 > 0) as hi from t group by v1) z where hi = 'a';
  optimized_logical_plan_for_stream: |-
    LogicalProject { exprs: [t.v1] }
    └─LogicalFilter { predicate: (max('a':Varchar) filter((t.v2 > 0:Int32)) = 'a':Varchar) }
      └─LogicalAgg { group_key: [t.v1], aggs: [max('a':Varchar) filter((t.v2 > 0:Int32))] }
        └─LogicalProject { exprs: [t.v1, t.v2, 'a':Varchar] }
          └─LogicalScan { table: t, columns: [t.v1, t.v2] }
- name: kept - aggregate of a constant without group key, which is NULL over no row
  before:
  - setup
  sql: |
    select hi from (select max('a') as hi from t) z where hi = 'a';
  optimized_logical_plan_for_stream: |-
    LogicalFilter { predicate: (max('a':Varchar) = 'a':Varchar) }
    └─LogicalAgg { aggs: [max('a':Varchar)] }
      └─LogicalProject { exprs: ['a':Varchar] }
        └─LogicalScan { table: t, columns: [] }
- name: kept - last_value of a value that differs between the branches of a union
  before:
  - setup
  sql: |
    with ops(op, k, ts) as (select 'set', v1, ts from t union all select 'delete', v1, ts from t where b)
    select k from (select k, last_value(op order by ts) as op from ops group by k) z where op = 'set';
  optimized_logical_plan_for_stream: |-
    LogicalProject { exprs: [t.v1] }
    └─LogicalFilter { predicate: (last_value('set':Varchar order_by(t.ts ASC)) = 'set':Varchar) }
      └─LogicalAgg { group_key: [t.v1], aggs: [last_value('set':Varchar order_by(t.ts ASC))] }
        └─LogicalUnion { all: true }
          ├─LogicalProject { exprs: ['set':Varchar, t.v1, t.ts] }
          │ └─LogicalScan { table: t, columns: [t.v1, t.ts] }
          └─LogicalProject { exprs: ['delete':Varchar, t.v1, t.ts] }
            └─LogicalScan { table: t, output_columns: [t.v1, t.ts], required_columns: [t.v1, t.ts, t.b], predicate: t.b }
- name: aggregate of a constant on the optional side of a left join stays nullable
  before:
  - setup
  sql: |
    select s.k, z.op is null as missing, z.op = 'set' as is_set from s left join (
      select v1, last_value('set' order by ts) as op from t group by v1
    ) z on s.k = z.v1;
  optimized_logical_plan_for_stream: |-
    LogicalProject { exprs: [s.k, IsNull(last_value('set':Varchar order_by(t.ts ASC))) as $expr1, (last_value('set':Varchar order_by(t.ts ASC)) = 'set':Varchar) as $expr2] }
    └─LogicalJoin { type: LeftOuter, on: (s.k = t.v1), output: [s.k, last_value('set':Varchar order_by(t.ts ASC))] }
      ├─LogicalScan { table: s, columns: [s.k] }
      └─LogicalAgg { group_key: [t.v1], aggs: [last_value('set':Varchar order_by(t.ts ASC))] }
        └─LogicalProject { exprs: [t.v1, 'set':Varchar, t.ts] }
          └─LogicalScan { table: t, columns: [t.v1, t.ts] }
- id: setup_watermark
  sql: |
    set streaming_prune_empty_relation = true;
    create table wt (k int, ts timestamp, watermark for ts as ts - interval '5 minutes') append only;
    create table d (id int primary key, k int, label varchar);
- name: kept - temporal join under emit on window close, contradiction on the looked up side
  before:
  - setup_watermark
  sql: |
    select window_start, count(*) as n
    from tumble(wt, ts, interval '1' hour) w
    join d for system_time as of proctime() on w.k = d.id
    where d.k = 1 and d.k = 2
    group by window_start;
  eowc_stream_plan: |-
    StreamMaterialize { columns: [window_start, n], stream_key: [window_start], pk_columns: [window_start], pk_conflict: NoCheck, watermark_columns: [window_start] }
    └─StreamHashAgg [append_only, eowc] { group_key: [$expr1], aggs: [count], output_watermarks: [[$expr1]] }
      └─StreamExchange { dist: HashShard($expr1) }
        └─StreamProject { exprs: [TumbleStart(wt.ts, '01:00:00':Interval) as $expr1, wt._row_id, wt.k], output_watermarks: [[$expr1]] }
          └─StreamTemporalJoin { type: Inner, append_only: true, predicate: wt.k = d.id AND (d.k = 1:Int32) AND (d.k = 2:Int32), nested_loop: false, output_watermarks: [[wt.ts]], output: [wt.ts, wt._row_id, wt.k, d.id] }
            ├─StreamExchange { dist: HashShard(wt.k) }
            │ └─StreamTableScan { table: wt, columns: [wt.k, wt.ts, wt._row_id], stream_scan_type: ArrangementBackfill, stream_key: [wt._row_id], pk: [_row_id], dist: UpstreamHashShard(wt._row_id) }
            └─StreamExchange [no_shuffle] { dist: UpstreamHashShard(d.id) }
              └─StreamTableScan { table: d, columns: [d.id, d.k], stream_scan_type: UpstreamOnly, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
- name: kept - contradiction on a table with a watermark
  before:
  - setup_watermark
  sql: |
    select k, ts from wt where k = 1 and k = 2;
  stream_plan: |-
    StreamMaterialize { columns: [k, ts, wt._row_id(hidden)], stream_key: [wt._row_id], pk_columns: [wt._row_id], pk_conflict: NoCheck, watermark_columns: [ts] }
    └─StreamFilter { predicate: false:Boolean }
      └─StreamTableScan { table: wt, columns: [wt.k, wt.ts, wt._row_id], stream_scan_type: SnapshotBackfill, stream_key: [wt._row_id], pk: [_row_id], dist: UpstreamHashShard(wt._row_id) }
- name: left join under emit on window close - the optional side without watermark is removed
  before:
  - setup_watermark
  sql: |
    select window_start, count(*) as n, count(d.label) as m
    from tumble(wt, ts, interval '1' hour) w
    left join (select * from d where k = 1 and k = 2) d on w.k = d.id
    group by window_start;
  eowc_stream_plan: |-
    StreamMaterialize { columns: [window_start, n, m], stream_key: [window_start], pk_columns: [window_start], pk_conflict: NoCheck, watermark_columns: [window_start] }
    └─StreamHashAgg [append_only, eowc] { group_key: [$expr1], aggs: [count, count(null:Varchar)], output_watermarks: [[$expr1]] }
      └─StreamExchange { dist: HashShard($expr1) }
        └─StreamProject { exprs: [TumbleStart(wt.ts, '01:00:00':Interval) as $expr1, null:Varchar, wt._row_id], output_watermarks: [[$expr1]] }
          └─StreamTableScan { table: wt, columns: [wt.ts, wt._row_id], stream_scan_type: SnapshotBackfill, stream_key: [wt._row_id], pk: [_row_id], dist: UpstreamHashShard(wt._row_id) }
