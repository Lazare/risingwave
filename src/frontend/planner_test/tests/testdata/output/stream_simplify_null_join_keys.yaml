        ├─StreamExchange { dist: HashShard(t.k) }
        │ └─StreamTableScan { table: t, columns: [t.k, t.ts, t._row_id], stream_scan_type: SnapshotBackfill, stream_key: [t._row_id], pk: [_row_id], dist: UpstreamHashShard(t._row_id) }
        └─StreamExchange { dist: HashShard(b.k) }
          └─StreamFilter { predicate: IsNull(b.k) }
            └─StreamTableScan { table: b, columns: [b.k, b.label, b.id], stream_scan_type: SnapshotBackfill, stream_key: [b.id], pk: [id], dist: UpstreamHashShard(b.id) }
- name: kept - temporal join whose left side carries the watermark of emit on window close
  before:
  - setup
  sql: |
    select window_start, count(*) as n
    from tumble(t, ts, interval '1' hour) w
    join b for system_time as of proctime() on w.k = b.id
    where b.id is null
    group by window_start;
  eowc_stream_plan: |-
    StreamMaterialize { columns: [window_start, n], stream_key: [window_start], pk_columns: [window_start], pk_conflict: NoCheck, watermark_columns: [window_start] }
    └─StreamHashAgg [append_only, eowc] { group_key: [$expr1], aggs: [count], output_watermarks: [[$expr1]] }
      └─StreamExchange { dist: HashShard($expr1) }
        └─StreamProject { exprs: [TumbleStart(t.ts, '01:00:00':Interval) as $expr1, t._row_id, t.k], output_watermarks: [[$expr1]] }
          └─StreamTemporalJoin { type: Inner, append_only: true, predicate: t.k = b.id AND IsNull(b.id), nested_loop: false, output_watermarks: [[t.ts]], output: [t.ts, t._row_id, t.k, b.id] }
            ├─StreamExchange { dist: HashShard(t.k) }
            │ └─StreamFilter { predicate: IsNull(t.k) }
            │   └─StreamTableScan { table: t, columns: [t.k, t.ts, t._row_id], stream_scan_type: ArrangementBackfill, stream_key: [t._row_id], pk: [_row_id], dist: UpstreamHashShard(t._row_id) }
            └─StreamExchange [no_shuffle] { dist: UpstreamHashShard(b.id) }
              └─StreamTableScan { table: b, columns: [b.id], stream_scan_type: UpstreamOnly, stream_key: [b.id], pk: [id], dist: UpstreamHashShard(b.id) }
