      └─StreamFilter { predicate: IsNull(b.k) }
        └─StreamHashJoin { type: LeftOuter, predicate: a.bk = b.k, output: [a.id, b.k, a.bk, b.id] }
          ├─StreamExchange { dist: HashShard(a.bk) }
          │ └─StreamTableScan { table: a, columns: [a.id, a.bk], stream_scan_type: SnapshotBackfill, stream_key: [a.id], pk: [id], dist: UpstreamHashShard(a.id) }
          └─StreamExchange { dist: HashShard(b.k) }
            └─StreamTableScan { table: b, columns: [b.k, b.id], stream_scan_type: SnapshotBackfill, stream_key: [b.id], pk: [id], dist: UpstreamHashShard(b.id) }
- name: kept - a removed side may carry a watermark (table with a watermark)
  before:
  - setup
  sql: |
    select t.ts, b.label from t join (select * from b where k is null) b on t.k = b.k;
  stream_plan: |-
