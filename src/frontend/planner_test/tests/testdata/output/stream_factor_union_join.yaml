    └─LogicalJoin { type: Inner, on: (g.a = e.id), output: [g.id, e.code] }
      ├─LogicalScan { table: g, columns: [g.id, g.a] }
      └─LogicalScan { table: e, columns: [e.id, e.code] }
- name: kept - an aggregation above the join of a branch
  before:
  - setup
  sql: |
    select f.id, d.name from f join d on f.dim_id = d.id
    union all
    select max(e.id), d.name from e join d on e.ref = d.id group by d.name;
  optimized_logical_plan_for_stream: |-
    LogicalUnion { all: true }
    ├─LogicalJoin { type: Inner, on: (f.dim_id = d.id), output: [f.id, d.name] }
    │ ├─LogicalScan { table: f, columns: [f.id, f.dim_id] }
    │ └─LogicalScan { table: d, columns: [d.id, d.name] }
    └─LogicalProject { exprs: [max(e.id), d.name] }
      └─LogicalAgg { group_key: [d.name], aggs: [max(e.id)] }
        └─LogicalJoin { type: Inner, on: (e.ref = d.id), output: [d.name, e.id] }
          ├─LogicalScan { table: e, columns: [e.id, e.ref] }
          └─LogicalScan { table: d, columns: [d.id, d.name] }
