    set streaming_factor_union_join = true;
    create table f (id int primary key, dim_id int, other_id int, amt int, label varchar);
    create table d (id int primary key, name varchar, grp int, active boolean);
    create table e (id int primary key, code varchar, ref int);
    create table g (id int primary key, a int, b int);
    create view da as select * from d where active;
    create view dj as select d.id, d.name, d.grp, g.a from d join g on d.grp = g.b;
    create view dagg as select grp, count(*) as cnt, max(name) as mx from d group by grp;
    create table h (id int primary key, ts timestamptz, v int);
    create view hrecent as select id, v from h where ts > now() - interval '1 hour';
    create view dnames as select grp, string_agg(name, ',') as names from d group by grp;
    create view dtop as select id, name from d order by grp limit 3;
