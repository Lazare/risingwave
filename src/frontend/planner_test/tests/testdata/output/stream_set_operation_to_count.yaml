                ├─StreamExchange { dist: HashShard(t.k, 0:Int32) }
                │ └─StreamProject { exprs: [(t.a + 1:Int32) as $expr1, Upper(t.b) as $expr2, 1:Int32, null:Int32, t.k, 0:Int32] }
