- name: two left-joined copies of a table joined on its key
  before:
  - setup_flat
  sql: |
    select d.id, e.code, g.a, d2.name from d left join e on d.grp = e.id
    join (d d2 left join g on d2.grp = g.id) on d.id = d2.id;
  optimized_logical_plan_for_stream: |-
    LogicalJoin { type: LeftOuter, on: (d.grp = e.id), output: [d.id, e.code, g.a, d.name] }
    ├─LogicalJoin { type: LeftOuter, on: (d.grp = g.id), output: [d.name, g.a, d.id, d.grp] }
    │ ├─LogicalScan { table: d, columns: [d.id, d.name, d.grp], predicate: IsNotNull(d.id) }
    │ └─LogicalScan { table: g, columns: [g.id, g.a] }
    └─LogicalScan { table: e, columns: [e.id, e.code] }
  stream_plan: |-
    StreamMaterialize { columns: [id, code, a, name, d.grp(hidden), e.id(hidden)], stream_key: [id, d.grp], pk_columns: [id, d.grp], pk_conflict: NoCheck }
    └─StreamExchange { dist: HashShard(d.id, d.grp) }
      └─StreamHashJoin { type: LeftOuter, predicate: d.grp = e.id, output: [d.id, e.code, g.a, d.name, d.grp, e.id] }
        ├─StreamHashJoin { type: LeftOuter, predicate: d.grp = g.id, output: [d.name, g.a, d.id, d.grp, g.id] }
        │ ├─StreamExchange { dist: HashShard(d.grp) }
        │ │ └─StreamFilter { predicate: IsNotNull(d.id) }
        │ │   └─StreamTableScan { table: d, columns: [d.id, d.name, d.grp], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
        │ └─StreamExchange { dist: HashShard(g.id) }
        │   └─StreamTableScan { table: g, columns: [g.id, g.a], stream_scan_type: SnapshotBackfill, stream_key: [g.id], pk: [id], dist: UpstreamHashShard(g.id) }
        └─StreamExchange { dist: HashShard(e.id) }
          └─StreamTableScan { table: e, columns: [e.id, e.code], stream_scan_type: SnapshotBackfill, stream_key: [e.id], pk: [id], dist: UpstreamHashShard(e.id) }
- name: left join of a chain that looks up the row of the left side
  before:
  - setup_flat
  sql: |
    select f.id, d.name, r.v, r.a from f join d on f.dim_id = d.id left join (
      select d2.id, case when d2.active then 0 else coalesce(g.a, d2.grp) end as v, g.a
      from d d2 join s on d2.id = s.id left join g on d2.id = g.id
    ) r on d.id = r.id;
  optimized_logical_plan_for_stream: |-
    LogicalProject { exprs: [f.id, d.name, Case(IsNotNull(s.id), Case(d.active, 0:Int32, Coalesce(g.a, d.grp))) as $expr1, g.a] }
    └─LogicalJoin { type: LeftOuter, on: (d.id = g.id) AND IsNotNull(s.id), output: [f.id, d.name, d.grp, d.active, s.id, g.a] }
      ├─LogicalJoin { type: LeftOuter, on: (d.id = s.id) AND IsNotNull(d.id), output: all }
      │ ├─LogicalJoin { type: Inner, on: (f.dim_id = d.id), output: [f.id, d.id, d.name, d.grp, d.active] }
      │ │ ├─LogicalScan { table: f, columns: [f.id, f.dim_id] }
      │ │ └─LogicalScan { table: d, columns: [d.id, d.name, d.grp, d.active] }
      │ └─LogicalScan { table: s, columns: [s.id] }
      └─LogicalScan { table: g, columns: [g.id, g.a] }
  stream_plan: |-
    StreamMaterialize { columns: [id, name, v, a, f.dim_id(hidden), s.sid(hidden), d.id(hidden)], stream_key: [id, f.dim_id, s.sid, d.id], pk_columns: [id, f.dim_id, s.sid, d.id], pk_conflict: NoCheck }
    └─StreamProject { exprs: [f.id, d.name, Case(IsNotNull(s.id), Case(d.active, 0:Int32, Coalesce(g.a, d.grp))) as $expr1, g.a, f.dim_id, s.sid, d.id] }
      └─StreamHashJoin { type: LeftOuter, predicate: d.id = g.id AND IsNotNull(s.id), output: [f.id, d.name, d.grp, d.active, s.id, g.a, f.dim_id, s.sid, d.id, g.id] }
        ├─StreamHashJoin { type: LeftOuter, predicate: d.id = s.id AND IsNotNull(d.id), output: [f.id, d.id, d.name, d.grp, d.active, s.id, f.dim_id, s.sid] }
        │ ├─StreamExchange { dist: HashShard(d.id) }
        │ │ └─StreamHashJoin { type: Inner, predicate: f.dim_id = d.id, output: [f.id, d.id, d.name, d.grp, d.active, f.dim_id] }
        │ │   ├─StreamExchange { dist: HashShard(f.dim_id) }
        │ │   │ └─StreamTableScan { table: f, columns: [f.id, f.dim_id], stream_scan_type: SnapshotBackfill, stream_key: [f.id], pk: [id], dist: UpstreamHashShard(f.id) }
        │ │   └─StreamExchange { dist: HashShard(d.id) }
        │ │     └─StreamTableScan { table: d, columns: [d.id, d.name, d.grp, d.active], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
        │ └─StreamExchange { dist: HashShard(s.id) }
        │   └─StreamTableScan { table: s, columns: [s.id, s.sid], stream_scan_type: SnapshotBackfill, stream_key: [s.sid], pk: [sid], dist: UpstreamHashShard(s.sid) }
        └─StreamExchange { dist: HashShard(g.id) }
          └─StreamTableScan { table: g, columns: [g.id, g.a], stream_scan_type: SnapshotBackfill, stream_key: [g.id], pk: [id], dist: UpstreamHashShard(g.id) }
- name: left join of a chain whose joins all compare the removed lookup
  before:
  - setup_flat
  sql: |
    select f.id, d.name, y.sid, y.z from f join d on f.dim_id = d.id left join (
      select g.id, s.sid, g.a + d2.grp as z from g join d d2 on g.id = d2.id join s on d2.id = s.id
    ) y on d.id = y.id;
  optimized_logical_plan_for_stream: |-
    LogicalProject { exprs: [f.id, d.name, s.sid, Case(IsNotNull(g.id), (g.a + d.grp)) as $expr1] }
    └─LogicalJoin { type: LeftOuter, on: (d.id = g.id) AND (g.id = d.id) AND (d.id = s.id), output: [f.id, d.name, d.grp, g.id, g.a, s.sid] }
      ├─LogicalJoin { type: Inner, on: (f.dim_id = d.id), output: [f.id, d.id, d.name, d.grp] }
      │ ├─LogicalScan { table: f, columns: [f.id, f.dim_id] }
      │ └─LogicalScan { table: d, columns: [d.id, d.name, d.grp] }
      └─LogicalJoin { type: Inner, on: (g.id = s.id), output: all }
        ├─LogicalScan { table: g, columns: [g.id, g.a] }
        └─LogicalScan { table: s, columns: [s.sid, s.id] }
  stream_plan: |-
    StreamMaterialize { columns: [id, name, sid, z, f.dim_id(hidden), d.id(hidden)], stream_key: [id, f.dim_id, sid, d.id], pk_columns: [id, f.dim_id, sid, d.id], pk_conflict: NoCheck }
    └─StreamProject { exprs: [f.id, d.name, s.sid, Case(IsNotNull(g.id), (g.a + d.grp)) as $expr1, f.dim_id, d.id] }
      └─StreamHashJoin { type: LeftOuter, predicate: d.id = g.id AND d.id = g.id AND d.id = s.id, output: [f.id, d.name, d.grp, g.id, g.a, s.sid, f.dim_id, d.id] }
        ├─StreamExchange { dist: HashShard(d.id) }
        │ └─StreamHashJoin { type: Inner, predicate: f.dim_id = d.id, output: [f.id, d.id, d.name, d.grp, f.dim_id] }
        │   ├─StreamExchange { dist: HashShard(f.dim_id) }
        │   │ └─StreamTableScan { table: f, columns: [f.id, f.dim_id], stream_scan_type: SnapshotBackfill, stream_key: [f.id], pk: [id], dist: UpstreamHashShard(f.id) }
        │   └─StreamExchange { dist: HashShard(d.id) }
        │     └─StreamTableScan { table: d, columns: [d.id, d.name, d.grp], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
        └─StreamHashJoin { type: Inner, predicate: g.id = s.id, output: all }
          ├─StreamExchange { dist: HashShard(g.id) }
          │ └─StreamTableScan { table: g, columns: [g.id, g.a], stream_scan_type: SnapshotBackfill, stream_key: [g.id], pk: [id], dist: UpstreamHashShard(g.id) }
          └─StreamExchange { dist: HashShard(s.id) }
            └─StreamTableScan { table: s, columns: [s.sid, s.id], stream_scan_type: SnapshotBackfill, stream_key: [s.sid], pk: [sid], dist: UpstreamHashShard(s.sid) }
- name: left join of a left-joined copy of the table of the left side
  before:
