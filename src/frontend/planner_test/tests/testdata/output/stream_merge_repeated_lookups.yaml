- id: setup_flat
  sql: |
    set streaming_merge_repeated_lookups = true;
    create table f (id int primary key, dim_id int, other_id int, amt int, label varchar);
    create table d (id int primary key, name varchar, grp int, active boolean);
    create table e (id int primary key, code varchar);
    create table g (id int primary key, a int, b int);
    create table s (sid int primary key, id int, ts int);
    create table h (rid int primary key, id int, x int);
    create view sd as select s.sid, s.id, s.ts, d.name, d.active from s join d on s.id = d.id;
    create view hd as select h.id, h.rid, e.code from h join d on h.id = d.id and d.active left join e on h.id = e.id;
