- name: lookup above an aggregation over a table function of the row
  before:
  - setup_flat
  sql: |
    select g.id, g.v, g.c, d2.name from (
      select d.id, x.v, count(*) as c from d cross join unnest(array[d.grp, d.id]) as x(v) group by d.id, x.v
    ) g join d d2 on g.id = d2.id;
  optimized_logical_plan_for_stream: |-
    LogicalProject { exprs: [d.id, Unnest(Array($1, $0)), count, Field(internal_last_seen_value($expr1), 0:Int32) as $expr2] }
    └─LogicalAgg { group_key: [d.id, Unnest(Array($1, $0))], aggs: [count, internal_last_seen_value($expr1)] }
      └─LogicalProject { exprs: [d.id, Unnest(Array($1, $0)), Row(d.name) as $expr1] }
        └─LogicalProjectSet { select_list: [$0, Unnest(Array($1, $0)), $2] }
          └─LogicalScan { table: d, columns: [d.id, d.grp, d.name], predicate: IsNotNull(d.id) }
  stream_plan: |-
    StreamMaterialize { columns: [id, v, c, name], stream_key: [id, v], pk_columns: [id, v], pk_conflict: NoCheck }
    └─StreamProject { exprs: [d.id, Unnest(Array($1, $0)), count, Field(internal_last_seen_value($expr1), 0:Int32) as $expr2] }
      └─StreamHashAgg { group_key: [d.id, Unnest(Array($1, $0))], aggs: [count, internal_last_seen_value($expr1)] }
        └─StreamProject { exprs: [d.id, Unnest(Array($1, $0)), Row(d.name) as $expr1, _rw_projected_row_id] }
          └─StreamProjectSet { select_list: [$0, Unnest(Array($1, $0)), $2] }
            └─StreamFilter { predicate: IsNotNull(d.id) }
              └─StreamTableScan { table: d, columns: [d.id, d.grp, d.name], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
- name: kept - nested lookup compared on a column that is not its key
  before:
  - setup_flat
  sql: |
    select f.id, d.grp, x.ts, x.name from f join d on f.dim_id = d.id
    join (select s.id, s.ts, d2.name from s join d d2 on s.id = d2.grp) x on d.id = x.id;
  optimized_logical_plan_for_stream: |-
    LogicalJoin { type: Inner, on: (d.id = s.id) AND (f.dim_id = s.id) AND (d.id = d.grp), output: [f.id, d.grp, s.ts, d.name] }
    ├─LogicalJoin { type: Inner, on: (f.dim_id = d.id), output: all }
    │ ├─LogicalScan { table: f, columns: [f.id, f.dim_id] }
    │ └─LogicalScan { table: d, columns: [d.id, d.grp] }
    └─LogicalJoin { type: Inner, on: (s.id = d.grp), output: all }
      ├─LogicalScan { table: s, columns: [s.id, s.ts] }
      └─LogicalScan { table: d, columns: [d.name, d.grp] }
- name: kept - nested lookup in the padded side of a left join of the tree
  before:
  - setup_flat
  sql: |
    select f.id, d.grp, x.ts, x.name from f join d on f.dim_id = d.id
    join (select s.id, s.ts, d2.name from s left join d d2 on s.id = d2.id) x on d.id = x.id;
  optimized_logical_plan_for_stream: |-
    LogicalJoin { type: Inner, on: (f.dim_id = s.id) AND (f.dim_id = d.id), output: [f.id, d.grp, s.ts, d.name] }
    ├─LogicalScan { table: f, columns: [f.id, f.dim_id], predicate: IsNotNull(f.dim_id) }
    └─LogicalFilter { predicate: IsNotNull(d.id) }
      └─LogicalJoin { type: LeftOuter, on: (s.id = d.id), output: all }
        ├─LogicalScan { table: s, columns: [s.id, s.ts] }
        └─LogicalScan { table: d, columns: [d.id, d.name, d.grp] }
- name: kept - left join whose condition tests a column of a left join of its right side
  before:
  - setup_flat
  sql: |
    select f.id, r.name, r.code from f left join d on f.dim_id = d.id left join (
      select d2.id, d2.name, e.code from d d2 left join e on d2.grp = e.id
    ) r on d.id = r.id and r.code = 'x';
  optimized_logical_plan_for_stream: |-
    LogicalProject { exprs: [f.id, Case(IsNotNull(e.id), d.name) as $expr1, e.code] }
    └─LogicalJoin { type: LeftOuter, on: (d.grp = e.id) AND IsNotNull(d.id), output: [f.id, d.name, e.id, e.code] }
      ├─LogicalJoin { type: LeftOuter, on: (f.dim_id = d.id), output: [f.id, d.id, d.name, d.grp] }
      │ ├─LogicalScan { table: f, columns: [f.id, f.dim_id] }
      │ └─LogicalScan { table: d, columns: [d.id, d.name, d.grp] }
      └─LogicalScan { table: e, columns: [e.id, e.code], predicate: (e.code = 'x':Varchar) }
