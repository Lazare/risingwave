    │ └─LogicalScan { table: p, columns: [p.a, p.b, p.v] }
    └─LogicalScan { table: p, columns: [p.a, p.b, p.w] }
- name: kept - first left lookup has an extra condition
  before:
  - setup
  sql: |
    select f.id, a.name, b.grp from f left join d a on f.dim_id = a.id and f.amt > a.grp left join d b on f.dim_id = b.id;
  optimized_logical_plan_for_stream: |-
    LogicalJoin { type: LeftOuter, on: (f.dim_id = d.id), output: [f.id, d.name, d.grp] }
    ├─LogicalJoin { type: LeftOuter, on: (f.dim_id = d.id) AND (f.amt > d.grp), output: [f.id, f.dim_id, d.name] }
    │ ├─LogicalScan { table: f, columns: [f.id, f.dim_id, f.amt] }
    │ └─LogicalScan { table: d, columns: [d.id, d.name, d.grp] }
    └─LogicalScan { table: d, columns: [d.id, d.grp] }
