- name: kept - key compared behind a cast
  before:
  - setup
  sql: |
    select f.id, a.name, b.grp from f left join d a on f.dim_id = a.id left join d b on f.dim_id::bigint = b.id::bigint;
  optimized_logical_plan_for_stream: |-
    LogicalJoin { type: LeftOuter, on: ($expr1 = $expr2), output: [f.id, d.name, d.grp] }
    ├─LogicalProject { exprs: [f.id, d.name, f.dim_id::Int64 as $expr1] }
    │ └─LogicalJoin { type: LeftOuter, on: (f.dim_id = d.id), output: [f.id, f.dim_id, d.name] }
    │   ├─LogicalScan { table: f, columns: [f.id, f.dim_id] }
    │   └─LogicalScan { table: d, columns: [d.id, d.name] }
    └─LogicalProject { exprs: [d.grp, d.id::Int64 as $expr2] }
      └─LogicalScan { table: d, columns: [d.id, d.grp] }
- name: kept - lookup below an aggregation of the other side
  before:
  - setup
  sql: |
    select t.dim_id, t.total, b.grp
    from (select f.dim_id, sum(f.amt) as total from f join d a on f.dim_id = a.id group by f.dim_id) t
    left join d b on t.dim_id = b.id;
  optimized_logical_plan_for_stream: |-
    LogicalJoin { type: LeftOuter, on: (f.dim_id = d.id), output: [f.dim_id, sum(f.amt), d.grp] }
    ├─LogicalAgg { group_key: [f.dim_id], aggs: [sum(f.amt)] }
    │ └─LogicalJoin { type: Inner, on: (f.dim_id = d.id), output: [f.dim_id, f.amt] }
    │   ├─LogicalScan { table: f, columns: [f.dim_id, f.amt] }
    │   └─LogicalScan { table: d, columns: [d.id] }
    └─LogicalScan { table: d, columns: [d.id, d.grp] }
