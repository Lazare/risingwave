- id: setup
  sql: |
    set streaming_merge_repeated_lookups = true;
    create table f (id int primary key, dim_id int, other_id int, amt int, label varchar);
    create table d (id int primary key, name varchar, grp int, active boolean);
    create table e (id int primary key, code varchar);
    create table p (a int, b int, v int, w int, primary key (a, b));
    create table g (id int primary key, a int, b int);
    create table nopk (id int, name varchar);
    create view v1 as select f.id, f.dim_id, f.amt, d.name from f left join d on f.dim_id = d.id;
    create view v2 as select v1.*, d.grp from v1 left join d on v1.dim_id = d.id;
    create view w1 as select f.id, f.dim_id, f.amt, d.name, d.id as did from f join d on f.dim_id = d.id;
    create view w2 as select w1.*, d.grp from w1 join d on w1.did = d.id;
    create view da as select * from d where active;
