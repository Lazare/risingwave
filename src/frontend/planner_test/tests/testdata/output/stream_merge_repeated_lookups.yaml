    └─LogicalJoin { type: Inner, on: (s.id = d.id) AND (d.id = s.id), output: [s.id, s.ts, d.name, d.grp] }
      ├─LogicalScan { table: s, columns: [s.id, s.ts], predicate: IsNotNull(s.id) }
      └─LogicalScan { table: d, columns: [d.id, d.name, d.grp], predicate: IsNotNull(d.id) }
  stream_plan: |-
    StreamMaterialize { columns: [id, grp, ts, name, f.dim_id(hidden), s.sid(hidden), s.id(hidden)], stream_key: [id, s.sid, f.dim_id], pk_columns: [id, s.sid, f.dim_id], pk_conflict: NoCheck }
    └─StreamExchange { dist: HashShard(f.id, f.dim_id, s.sid) }
      └─StreamHashJoin { type: Inner, predicate: f.dim_id = s.id, output: [f.id, d.grp, s.ts, d.name, f.dim_id, s.sid, s.id] }
        ├─StreamExchange { dist: HashShard(f.dim_id) }
        │ └─StreamTableScan { table: f, columns: [f.id, f.dim_id], stream_scan_type: SnapshotBackfill, stream_key: [f.id], pk: [id], dist: UpstreamHashShard(f.id) }
        └─StreamHashJoin { type: Inner, predicate: s.id = d.id AND s.id = d.id, output: [s.id, s.ts, d.name, d.grp, s.sid, d.id] }
          ├─StreamExchange { dist: HashShard(s.id) }
          │ └─StreamFilter { predicate: IsNotNull(s.id) }
          │   └─StreamTableScan { table: s, columns: [s.id, s.ts, s.sid], stream_scan_type: SnapshotBackfill, stream_key: [s.sid], pk: [sid], dist: UpstreamHashShard(s.sid) }
          └─StreamExchange { dist: HashShard(d.id) }
            └─StreamFilter { predicate: IsNotNull(d.id) }
              └─StreamTableScan { table: d, columns: [d.id, d.name, d.grp], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
- name: nested inner lookup - the equality comes from a sibling join
  before:
  - setup_flat
  sql: |
    select f.id, d.grp, d2.name, s.ts from f join d on f.dim_id = d.id join s on s.id = f.dim_id join d d2 on d2.id = s.id;
  optimized_logical_plan_for_stream: |-
    LogicalJoin { type: Inner, on: (s.id = f.dim_id) AND (f.dim_id = d.id), output: [f.id, d.grp, d.name, s.ts] }
    ├─LogicalScan { table: f, columns: [f.id, f.dim_id], predicate: IsNotNull(f.dim_id) }
    └─LogicalJoin { type: Inner, on: (d.id = s.id), output: all }
      ├─LogicalScan { table: s, columns: [s.id, s.ts] }
      └─LogicalScan { table: d, columns: [d.id, d.name, d.grp] }
- name: nested inner lookup with a filter on the removed side
  before:
