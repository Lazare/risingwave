          │ └─StreamTableScan { table: h, columns: [h.id, h.rid], stream_scan_type: SnapshotBackfill, stream_key: [h.rid], pk: [rid], dist: UpstreamHashShard(h.rid) }
          └─StreamExchange { dist: HashShard(e.id) }
            └─StreamTableScan { table: e, columns: [e.id], stream_scan_type: SnapshotBackfill, stream_key: [e.id], pk: [id], dist: UpstreamHashShard(e.id) }
- name: not exists on a shared view whose rows the left side all carries
  before:
  - setup_flat
  sql: |
    select f.id, h.rid from f join d on f.dim_id = d.id join h on h.id = d.id
    where not exists (select 1 from hd where hd.id = f.dim_id)
    union all
    select hd.id, hd.rid from hd;
  optimized_logical_plan_for_stream: |-
    LogicalUnion { all: true }
    ├─LogicalJoin { type: LeftAnti, on: (h.id = f.dim_id), output: [f.id, h.rid] }
    │ ├─LogicalJoin { type: Inner, on: (h.id = d.id), output: [f.id, f.dim_id, h.rid] }
