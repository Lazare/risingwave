    │     └─LogicalJoin { type: LeftOuter, on: (h.id = e.id), output: [h.id, h.rid] }
    │       ├─LogicalJoin { type: Inner, on: (h.id = d.id), output: [h.rid, h.id] }
    │       │ ├─LogicalScan { table: h, columns: [h.rid, h.id] }
    │       │ └─LogicalScan { table: d, output_columns: [d.id], required_columns: [d.id, d.active], predicate: d.active }
    │       └─LogicalScan { table: e, columns: [e.id] }
    └─LogicalShare { id: 5 }
      └─LogicalJoin { type: LeftOuter, on: (h.id = e.id), output: [h.id, h.rid] }
        ├─LogicalJoin { type: Inner, on: (h.id = d.id), output: [h.rid, h.id] }
        │ ├─LogicalScan { table: h, columns: [h.rid, h.id] }
        │ └─LogicalScan { table: d, output_columns: [d.id], required_columns: [d.id, d.active], predicate: d.active }
        └─LogicalScan { table: e, columns: [e.id] }
  stream_plan: |-
    StreamMaterialize { columns: [id, rid, f.id(hidden), f.dim_id(hidden), h.rid(hidden), d.id(hidden), $src(hidden)], stream_key: [f.id, f.dim_id, h.rid, d.id, $src], pk_columns: [f.id, f.dim_id, h.rid, d.id, $src], pk_conflict: NoCheck }
    └─StreamUnion { all: true }
      ├─StreamExchange { dist: HashShard(f.id, f.dim_id, h.rid, d.id, 0:Int32) }
      │ └─StreamProject { exprs: [f.id, h.rid, f.id, f.dim_id, h.rid, d.id, 0:Int32] }
      │   └─StreamHashJoin { type: LeftAnti, predicate: f.dim_id = h.id, output: [f.id, h.rid, f.dim_id, d.id] }
      │     ├─StreamExchange { dist: HashShard(f.dim_id) }
      │     │ └─StreamHashJoin { type: Inner, predicate: d.id = h.id, output: [f.id, f.dim_id, h.rid, d.id] }
      │     │   ├─StreamExchange { dist: HashShard(d.id) }
      │     │   │ └─StreamHashJoin { type: Inner, predicate: f.dim_id = d.id, output: all }
      │     │   │   ├─StreamExchange { dist: HashShard(f.dim_id) }
      │     │   │   │ └─StreamTableScan { table: f, columns: [f.id, f.dim_id], stream_scan_type: SnapshotBackfill, stream_key: [f.id], pk: [id], dist: UpstreamHashShard(f.id) }
      │     │   │   └─StreamExchange { dist: HashShard(d.id) }
      │     │   │     └─StreamTableScan { table: d, columns: [d.id], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
      │     │   └─StreamExchange { dist: HashShard(h.id) }
      │     │     └─StreamTableScan { table: h, columns: [h.rid, h.id], stream_scan_type: SnapshotBackfill, stream_key: [h.rid], pk: [rid], dist: UpstreamHashShard(h.rid) }
      │     └─StreamProject { exprs: [h.id, h.rid] }
      │       └─StreamShare { id: 15 }
      │         └─StreamHashJoin { type: LeftOuter, predicate: h.id = e.id, output: [h.id, h.rid, e.id] }
      │           ├─StreamHashJoin { type: Inner, predicate: h.id = d.id, output: all }
      │           │ ├─StreamExchange { dist: HashShard(h.id) }
      │           │ │ └─StreamTableScan { table: h, columns: [h.rid, h.id], stream_scan_type: SnapshotBackfill, stream_key: [h.rid], pk: [rid], dist: UpstreamHashShard(h.rid) }
      │           │ └─StreamExchange { dist: HashShard(d.id) }
      │           │   └─StreamProject { exprs: [d.id] }
      │           │     └─StreamFilter { predicate: d.active }
      │           │       └─StreamTableScan { table: d, columns: [d.id, d.active], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
      │           └─StreamExchange { dist: HashShard(e.id) }
      │             └─StreamTableScan { table: e, columns: [e.id], stream_scan_type: SnapshotBackfill, stream_key: [e.id], pk: [id], dist: UpstreamHashShard(e.id) }
      └─StreamExchange { dist: HashShard(h.rid, h.id, null:Int32, null:Int32, 1:Int32) }
        └─StreamProject { exprs: [h.id, h.rid, h.rid, h.id, null:Int32, null:Int32, 1:Int32] }
          └─StreamShare { id: 15 }
            └─StreamHashJoin { type: LeftOuter, predicate: h.id = e.id, output: [h.id, h.rid, e.id] }
              ├─StreamHashJoin { type: Inner, predicate: h.id = d.id, output: all }
              │ ├─StreamExchange { dist: HashShard(h.id) }
              │ │ └─StreamTableScan { table: h, columns: [h.rid, h.id], stream_scan_type: SnapshotBackfill, stream_key: [h.rid], pk: [rid], dist: UpstreamHashShard(h.rid) }
              │ └─StreamExchange { dist: HashShard(d.id) }
              │   └─StreamProject { exprs: [d.id] }
              │     └─StreamFilter { predicate: d.active }
              │       └─StreamTableScan { table: d, columns: [d.id, d.active], stream_scan_type: SnapshotBackfill, stream_key: [d.id], pk: [id], dist: UpstreamHashShard(d.id) }
              └─StreamExchange { dist: HashShard(e.id) }
                └─StreamTableScan { table: e, columns: [e.id], stream_scan_type: SnapshotBackfill, stream_key: [e.id], pk: [id], dist: UpstreamHashShard(e.id) }
- name: kept - exists on a shared view of which a join would be left
  before:
  - setup_flat
  sql: |
    select f.id from f join d on f.dim_id = d.id
    where exists (select 1 from hd where hd.id = f.dim_id)
    union all
    select hd.id from hd;
  optimized_logical_plan_for_stream: |-
    LogicalUnion { all: true }
    ├─LogicalJoin { type: LeftSemi, on: (h.id = f.dim_id), output: [f.id] }
    │ ├─LogicalJoin { type: Inner, on: (f.dim_id = d.id), output: [f.id, f.dim_id] }
    │ │ ├─LogicalScan { table: f, columns: [f.id, f.dim_id] }
    │ │ └─LogicalScan { table: d, columns: [d.id] }
    │ └─LogicalShare { id: 4 }
    │   └─LogicalJoin { type: LeftOuter, on: (h.id = e.id), output: [h.id] }
    │     ├─LogicalJoin { type: Inner, on: (h.id = d.id), output: [h.id] }
    │     │ ├─LogicalScan { table: h, columns: [h.id] }
    │     │ └─LogicalScan { table: d, output_columns: [d.id], required_columns: [d.id, d.active], predicate: d.active }
    │     └─LogicalScan { table: e, columns: [e.id] }
    └─LogicalShare { id: 4 }
      └─LogicalJoin { type: LeftOuter, on: (h.id = e.id), output: [h.id] }
        ├─LogicalJoin { type: Inner, on: (h.id = d.id), output: [h.id] }
        │ ├─LogicalScan { table: h, columns: [h.id] }
        │ └─LogicalScan { table: d, output_columns: [d.id], required_columns: [d.id, d.active], predicate: d.active }
        └─LogicalScan { table: e, columns: [e.id] }
- name: exists on a column that is not a key, carried by the left side
  before:
  - setup_flat
  sql: |
    select f.id, h.x from f join h on f.dim_id = h.id where exists (select 1 from h h2 where h2.id = f.dim_id);
