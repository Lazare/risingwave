    BatchExchange { order: [], dist: Single }
    └─BatchProject { exprs: [t.x, (count + 1:Int32) as $expr1] }
      └─BatchHashAgg { group_key: [t.x], aggs: [count] }
        └─BatchExchange { order: [], dist: HashShard(t.x) }
          └─BatchFilter { predicate: (t.x = first_value) }
            └─BatchOverWindow { window_functions: [first_value(t.x) OVER(PARTITION BY true:Boolean ORDER BY t.x ASC ROWS BETWEEN 1 PRECEDING AND 1 PRECEDING)] }
              └─BatchExchange { order: [true:Boolean ASC, t.x ASC], dist: HashShard(true:Boolean) }
                └─BatchSort { order: [true:Boolean ASC, t.x ASC] }
                  └─BatchProject { exprs: [t.x, true:Boolean] }
                    └─BatchFilter { predicate: IsNotNull(t.x) }
                      └─BatchScan { table: t, columns: [t.x], distribution: SomeShard }
