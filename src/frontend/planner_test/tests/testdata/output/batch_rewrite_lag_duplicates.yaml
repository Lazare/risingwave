- name: streaming plan does not change
  before:
  - setup
  sql: |
    with ordered as (select x, lag(x) over (partition by true order by x) as prev from t where x is not null),
    duplicates as (select * from ordered where x = prev)
    select x as unique_field, count(*) + 1 as n_records from duplicates group by x;
  stream_plan: |-
    StreamMaterialize { columns: [unique_field, n_records], stream_key: [unique_field], pk_columns: [unique_field], pk_conflict: NoCheck }
    └─StreamProject { exprs: [t.x, (count + 1:Int32) as $expr1] }
      └─StreamHashAgg { group_key: [t.x], aggs: [count] }
        └─StreamExchange { dist: HashShard(t.x) }
          └─StreamFilter { predicate: (t.x = first_value) }
            └─StreamOverWindow { window_functions: [first_value(t.x) OVER(PARTITION BY true:Boolean ORDER BY t.x ASC ROWS BETWEEN 1 PRECEDING AND 1 PRECEDING)] }
              └─StreamExchange { dist: HashShard(true:Boolean) }
                └─StreamProject { exprs: [t.x, true:Boolean, t.id] }
                  └─StreamFilter { predicate: IsNotNull(t.x) }
                    └─StreamTableScan { table: t, columns: [t.x, t.id], stream_scan_type: SnapshotBackfill, stream_key: [t.id], pk: [id], dist: UpstreamHashShard(t.id) }
