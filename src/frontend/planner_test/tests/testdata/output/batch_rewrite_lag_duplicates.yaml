                └─BatchScan { table: t, columns: [t.x, t.y], distribution: SomeShard }
- name: another window function read above
  before:
  - setup
  sql: |
    with ordered as (select x, lag(x) over (order by x) as prev, row_number() over (order by x) as rn from t)
